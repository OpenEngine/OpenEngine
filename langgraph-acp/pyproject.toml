[project]
name = "langgraph-acp"
version = "0.0.0"
description = "Use ACP-compatible agents as first-class LangGraph nodes."
readme = "README.md"
requires-python = ">=3.13"
# INVARIANT: the core types carry no dependencies, and in particular name no
# ACP agent implementation. LangGraph arrives with the node, an ACP client with
# the provider; neither is needed to describe a session, an event, or a result.
# Enforced by tests/test_public_api.py.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_acp"]

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
# `py.typed` promises a downstream type checker that these annotations are
# true, and only a type checker run against them keeps that promise. The tests
# are checked too: they are where the spellings this package documents are
# written out, so an annotation that rejects a documented call fails here.
strict = true
files = ["src", "tests"]
