[project]
name = "langgraph-acp"
version = "0.0.0"
description = "Use ACP-compatible agents as first-class LangGraph nodes."
readme = "README.md"
requires-python = ">=3.13"
# INVARIANT: the core types carry no dependencies, and in particular name no
# ACP agent implementation. LangGraph arrives with the node, an ACP client with
# the provider; neither is needed to describe a session, an event, or a result.
# Enforced by tests/test_public_api.py.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_acp"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
