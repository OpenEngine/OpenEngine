[project]
name = "engine-adapter-state-store-sqlite"
version = "0.0.0"
description = "State Store capability backed by SQLite."
requires-python = ">=3.11"
# SQLite ships with Python; only the state-store port and its domain types are
# needed at runtime.
dependencies = ["engine-ports"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-ports = { workspace = true }
