[project]
name = "engine-adapter-sandbox-smolvm"
version = "1.3.0"
description = "Sandbox capability using SmolVM microVMs."
requires-python = ">=3.11.8"
dependencies = ["engine-ports"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-ports = { workspace = true }
