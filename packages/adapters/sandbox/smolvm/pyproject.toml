[project]
name = "engine-adapter-sandbox-smolvm"
version = "1.11.0"
description = "Sandbox capability using SmolVM microVMs."
requires-python = ">=3.11.13,!=3.12.0,!=3.12.1,!=3.12.2,!=3.12.3,!=3.12.4,!=3.12.5,!=3.12.6,!=3.12.7,!=3.12.8,!=3.12.9,!=3.12.10,!=3.13.0,!=3.13.1,!=3.13.2,!=3.13.3"
dependencies = ["engine-ports"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-ports = { workspace = true }
