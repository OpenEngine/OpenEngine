[project]
name = "engine-adapter-anthropic"
version = "0.0.0"
description = "Agent Runner capability backed by the Claude API."
requires-python = ">=3.11"
dependencies = ["engine-runtime", "anthropic>=0.69"]

[project.entry-points."engine.agent_runners"]
anthropic = "engine.adapters.anthropic:build_agent_runner"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-runtime = { workspace = true }
