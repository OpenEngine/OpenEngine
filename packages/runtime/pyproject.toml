[project]
name = "engine-runtime"
version = "0.0.0"
description = "Dispatches engine commands to capability implementations."
requires-python = ">=3.11"
# `engine-graph-runtime` is the contract, not an engine: the workflow loader
# needs to recognise a graph workflow, and recognising one is two attributes.
dependencies = ["engine-domain", "engine-core", "engine-ports", "engine-graph-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-domain = { workspace = true }
engine-core = { workspace = true }
engine-ports = { workspace = true }
engine-graph-runtime = { workspace = true }
