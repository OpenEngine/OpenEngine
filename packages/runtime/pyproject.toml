[project]
name = "engine-runtime"
version = "0.0.0"
description = "Dispatches engine commands to capability implementations."
requires-python = ">=3.11"
dependencies = ["engine-domain", "engine-core", "engine-ports"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-domain = { workspace = true }
engine-core = { workspace = true }
engine-ports = { workspace = true }
