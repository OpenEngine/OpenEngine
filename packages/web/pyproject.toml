[project]
name = "engine-web"
version = "0.0.0"
description = "Provider-agnostic planner surface: HTTP API, SSE stream, and UI."
requires-python = ">=3.11"
# Depends on the runtime and ports only. It must never name an adapter -- this is
# the package consumers embed, so a vendor import here would be a weld.
# Enforced by tests/test_boundaries.py.
dependencies = ["engine-domain", "engine-runtime", "fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-domain = { workspace = true }
engine-runtime = { workspace = true }
