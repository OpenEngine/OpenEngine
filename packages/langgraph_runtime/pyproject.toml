[project]
name = "engine-langgraph-runtime"
version = "0.0.0"
description = "An API control surface over a LangGraph workflow: runs, state, topology, events, steering, and manual transitions."
requires-python = ">=3.11"
# LangGraph itself is not named here yet. This distribution is the control
# surface and the contract a LangGraph binding has to satisfy; the binding is
# the next package, and it is what will declare the dependency.
dependencies = ["engine-domain", "starlette>=0.52"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-domain = { workspace = true }
