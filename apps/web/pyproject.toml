[project]
name = "engine-web"
version = "0.0.0"
description = "Web control interface: an assistant-ui client for chatting with engine agents."
requires-python = ">=3.11"
# Composition root: the only layer allowed to depend on concrete adapters.
# The ASGI server is the Python half of the assistant-ui application. The React
# dependencies live in this directory's package.json.
dependencies = [
    "engine-runtime",
    # One adapter per capability, named <capability>-<vendor>: what is needed
    # first, who provides it second. SQLite gives chat durable conversations
    # without requiring an external database service.
    # Two vendors under one capability: the chat page offers a choice between
    # them, and the composition root is the only thing that knows their names.
    "engine-adapter-agent-runner-codex",
    "engine-adapter-agent-runner-claude-code",
    "engine-adapter-communications-buzz",
    "engine-adapter-source-control-github",
    "engine-adapter-state-store-sqlite",
    "engine-adapter-workflow-runtime-temporal",
    "engine-adapter-workspace-provider-git-worktree",
    "starlette>=0.52",
    "uvicorn>=0.35",
]

[project.scripts]
# The installed product, and the operator-facing name it wraps.
openengine = "engine.apps.web.cli:main"
engine-web = "engine.apps.web.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Vite's output is a build artifact, so it is git-ignored, so hatchling would
# leave it out of the wheel -- which is precisely the file set that has to be
# in it. `artifacts` is the exception list for exactly this case: generated,
# not committed, still shipped.
artifacts = ["src/engine/apps/web/client/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-runtime = { workspace = true }
engine-adapter-agent-runner-codex = { workspace = true }
engine-adapter-agent-runner-claude-code = { workspace = true }
engine-adapter-communications-buzz = { workspace = true }
engine-adapter-source-control-github = { workspace = true }
engine-adapter-state-store-sqlite = { workspace = true }
engine-adapter-workflow-runtime-temporal = { workspace = true }
engine-adapter-workspace-provider-git-worktree = { workspace = true }
