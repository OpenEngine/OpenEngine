[project]
name = "engine-worker"
version = "0.0.0"
description = "Worker: executes engine commands against real capabilities."
requires-python = ">=3.11"
# Composition root: the only layer allowed to depend on concrete adapters.
dependencies = [
    "engine-core",
    "engine-runtime",
    "engine-graph-runtime-langgraph",
    # One adapter per capability, named <capability>-<vendor>: what is needed
    # first, who provides it second.
    "engine-adapter-agent-runner-codex",
    "engine-adapter-communications-buzz",
    "engine-adapter-source-control-github",
    "engine-adapter-state-store-postgres",
    "engine-adapter-workflow-runtime-temporal",
    "engine-adapter-workspace-provider-git-worktree",
]

[project.scripts]
engine-worker = "engine.apps.worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-core = { workspace = true }
engine-runtime = { workspace = true }
engine-graph-runtime-langgraph = { workspace = true }
engine-adapter-agent-runner-codex = { workspace = true }
engine-adapter-communications-buzz = { workspace = true }
engine-adapter-source-control-github = { workspace = true }
engine-adapter-state-store-postgres = { workspace = true }
engine-adapter-workflow-runtime-temporal = { workspace = true }
engine-adapter-workspace-provider-git-worktree = { workspace = true }
