[project]
name = "engine-cli"
version = "0.1.0"
description = "Terminal control surface for a local or remote OpenEngine service."
requires-python = ">=3.11"
dependencies = ["platformdirs>=4"]

[project.scripts]
engine = "engine.apps.cli.__main__:main"
oe = "engine.apps.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
