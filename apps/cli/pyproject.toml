[project]
name = "engine-cli"
version = "0.0.0"
description = "Terminal client for the OpenEngine public API."
requires-python = ">=3.11"
dependencies = ["httpx>=0.28", "rich>=13"]

[project.scripts]
engine = "engine.apps.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
