[project]
name = "engine-control-server"
version = "0.0.0"
description = "Serves the planner surface. Provider-agnostic: backends resolve by name from installed plugins."
requires-python = ">=3.11"
# No adapter dependencies. This app is shipped to consumers, so the agent backend
# is theirs to choose -- install an adapter package and set ENGINE_AGENT_RUNNER.
# Enforced by tests/test_boundaries.py.
dependencies = [
    "engine-core",
    "engine-runtime",
    "engine-web",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Convenience bundles. `uv sync --extra claude` for a live planner; `demo` needs
# no credentials and is what the tests run against.
anthropic = ["engine-adapter-anthropic"]
demo = ["engine-adapter-scripted"]
all = ["engine-adapter-anthropic", "engine-adapter-scripted", "engine-adapter-openai"]

[project.scripts]
engine-control-server = "engine.apps.control_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-core = { workspace = true }
engine-runtime = { workspace = true }
engine-web = { workspace = true }
engine-adapter-anthropic = { workspace = true }
engine-adapter-scripted = { workspace = true }
engine-adapter-openai = { workspace = true }
