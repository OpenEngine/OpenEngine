[project]
name = "engine-control-server"
version = "0.0.0"
description = "Control server: ingress and composition root for the agent engine."
requires-python = ">=3.11"
# Composition root: the only layer allowed to depend on concrete adapters.
dependencies = [
    "engine-core",
    "engine-runtime",
    "engine-adapter-temporal",
    "engine-adapter-github",
    "engine-adapter-codex",
    "engine-adapter-communications",
    "engine-adapter-workspace",
    "engine-adapter-postgres",
]

[project.scripts]
engine-control-server = "engine.apps.control_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-core = { workspace = true }
engine-runtime = { workspace = true }
engine-adapter-temporal = { workspace = true }
engine-adapter-github = { workspace = true }
engine-adapter-codex = { workspace = true }
engine-adapter-communications = { workspace = true }
engine-adapter-workspace = { workspace = true }
engine-adapter-postgres = { workspace = true }
