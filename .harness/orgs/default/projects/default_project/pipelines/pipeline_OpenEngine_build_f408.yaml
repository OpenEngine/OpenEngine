pipeline:
  id: pipeline_OpenEngine_build_f408
  name: pipeline_OpenEngine_build_f408
  description: Builds and tests OpenEngine, with an AI agent step that implements a given task.
  inputs:
    task:
      type: string
      description: Task for the agent to implement, with its specifications
      default: ""
  stages:
    - id: build_and_test
      name: Build and Test
      runtime: cloud
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - id: install_deps
          name: Install UV and Dependencies
          run:
            shell: bash
            script: |-
              set -euo pipefail

              # Install UV
              curl -LsSf https://astral.sh/uv/0.9.28/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"

              # Install workspace dependencies using UV (handles Python version from .python-version)
              uv sync --locked --all-packages

              # Verify installation
              uv run python --version
        - id: implement_task
          name: Implement Task
          template:
            uses: ca_task_implementer@1.0.0
            with:
              task: ${{ inputs.task }}
        - id: run_tests
          name: Run Tests
          run:
            shell: bash
            script: |-
              set -euo pipefail
              export PATH="$HOME/.local/bin:$PATH"

              mkdir -p .harness/reports .harness/coverage

              # Run tests with JUnit XML and coverage output
              # pytest addopts from pyproject.toml: -q -m 'not compatibility'
              uv run pytest \
                --junitxml=.harness/reports/junit.xml \
                --cov \
                --cov-report=xml:.harness/coverage/coverage.xml \
                --cov-report=term-missing
            report:
              type: junit
              paths:
                - .harness/reports/junit.xml
        - id: upload_coverage
          name: Upload Coverage
          run:
            shell: bash
            script: |-
              test -s ".harness/coverage/coverage.xml"
              hcli cov upload --file=".harness/coverage/coverage.xml"
  tags:
    onboarding: "true"
    ai_generated: ""
