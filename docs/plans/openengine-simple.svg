<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1203px" preserveAspectRatio="none" style="width:704px;height:1203px;background:#FFFFFF;" version="1.1" viewBox="0 0 704 1203" width="704px" zoomAndPan="magnify"><title>How OpenEngine works today &#8212; simplified example</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="377.6377" x="162.1272" y="33.5352">How OpenEngine works today &#8212; simplified example</text></g><ellipse cx="221.7056" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#EDF3FA" height="36.4883" rx="12.5" ry="12.5" style="stroke:#557799;stroke-width:0.5;" width="165.626" x="138.8926" y="87.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.626" x="148.8926" y="111.0234">Start a run of a graph</text><rect fill="none" height="714.7539" style="stroke:#000000;stroke-width:1.5;" width="421.4111" x="11" y="133.9766"/><path d="M260.5654,133.9766 L260.5654,143.4648 L250.5654,153.4648 L11,153.4648" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="239.5654" x="14" y="148.5117">Graph: steps connected in an order</text><rect fill="#EDF3FA" height="36.4883" rx="12.5" ry="12.5" style="stroke:#557799;stroke-width:0.5;" width="211.4063" x="116.0024" y="170.4648"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="191.4063" x="126.0024" y="194">Step 1: Prepare a workspace</text><rect fill="none" height="489.8594" style="stroke:#000000;stroke-width:1.5;" width="401.4111" x="21" y="217.4063"/><path d="M412.4111,217.4063 L412.4111,226.8945 L402.4111,236.8945 L21,236.8945" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="381.4111" x="24" y="231.9414">Step 2: Agent node &#8212; for example, implement a change</text><rect fill="#EDF3FA" height="36.4883" rx="12.5" ry="12.5" style="stroke:#557799;stroke-width:0.5;" width="299.3916" x="72.0098" y="253.8945"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="279.3916" x="82.0098" y="277.4297">Build a prompt from selected graph state</text><rect fill="#EDF3FA" height="52.9766" rx="12.5" ry="12.5" style="stroke:#557799;stroke-width:0.5;" width="332.8877" x="55.2617" y="310.3828"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="312.8877" x="65.2617" y="333.918">langgraph-acp connects to the selected agent</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="290.6982" x="65.2617" y="350.4063">Codex OR Claude, through its ACP adapter</text><rect fill="#EDF3FA" height="52.9766" rx="12.5" ry="12.5" style="stroke:#557799;stroke-width:0.5;" width="327.9385" x="57.7363" y="383.3594"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="162.4219" x="67.7363" y="406.8945">Create an agent session</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="307.9385" x="67.7363" y="423.3828">(or load an existing session when recovering)</text><rect fill="#EDF3FA" height="36.4883" rx="12.5" ry="12.5" style="stroke:#557799;stroke-width:0.5;" width="223.9844" x="109.7134" y="456.3359"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="203.9844" x="119.7134" y="479.8711">Send the prompt through ACP</text><rect fill="#EDF3FA" height="52.9766" rx="12.5" ry="12.5" style="stroke:#557799;stroke-width:0.5;" width="278.0977" x="82.6567" y="512.8242"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="204.6748" x="92.6567" y="536.3594">Agent works in the workspace</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="258.0977" x="92.6567" y="552.8477">and streams responses / tool updates</text><rect fill="#EDF3FA" height="52.9766" rx="12.5" ry="12.5" style="stroke:#557799;stroke-width:0.5;" width="301.3125" x="71.0493" y="585.8008"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="281.3125" x="81.0493" y="609.3359">OpenEngine handles permission requests</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128.9736" x="81.0493" y="625.8242">and records events</text><rect fill="#EDF3FA" height="36.4883" rx="12.5" ry="12.5" style="stroke:#557799;stroke-width:0.5;" width="285.3711" x="79.02" y="658.7773"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="265.3711" x="89.02" y="682.3125">Write the node's result into graph state</text><rect fill="#EDF3FA" height="36.4883" rx="12.5" ry="12.5" style="stroke:#557799;stroke-width:0.5;" width="148.3379" x="147.5366" y="727.2656"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128.3379" x="157.5366" y="750.8008">Step 3: Run checks</text><rect fill="#EDF3FA" height="52.9766" rx="12.5" ry="12.5" style="stroke:#557799;stroke-width:0.5;" width="329.4492" x="56.981" y="783.7539"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="167.2822" x="66.981" y="807.2891">Step 4: Review the result</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="309.4492" x="66.981" y="823.7773">(can be another Codex or Claude agent node)</text><rect fill="#EDF3FA" height="36.4883" rx="12.5" ry="12.5" style="stroke:#557799;stroke-width:0.5;" width="113.8027" x="164.8042" y="868.7305"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.8027" x="174.8042" y="892.2656">Finish the run</text><path d="M252.7056,915.2188 L252.7056,965.6836 L232.7056,969.6836 L252.7056,973.6836 L252.7056,1024.1484 A0,0 0 0 0 252.7056,1024.1484 L692.8921,1024.1484 A0,0 0 0 0 692.8921,1024.1484 L692.8921,925.2188 L682.8921,915.2188 L252.7056,915.2188 A0,0 0 0 0 252.7056,915.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M682.8921,915.2188 L682.8921,925.2188 L692.8921,925.2188 L682.8921,915.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="316.8594" x="258.7056" y="933.7539">This is an example graph, not a fixed pipeline.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="343.4102" x="258.7056" y="950.2422">Each graph defines its own steps and connections.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="419.1865" x="258.7056" y="966.7305">Graphs can also branch, repeat steps, or run steps in parallel.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="258.7056" y="983.2188">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="192.4795" x="258.7056" y="999.707">Only agent nodes need ACP.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="321.0225" x="258.7056" y="1016.1953">Other nodes can run ordinary application code.</text><ellipse cx="221.7056" cy="969.6836" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="221.7056" cy="969.6836" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="221.7056" x2="221.7056" y1="67.4883" y2="87.4883"/><polygon fill="#181818" points="217.7056,77.4883,221.7056,87.4883,225.7056,77.4883,221.7056,81.4883" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="221.7056" x2="221.7056" y1="290.3828" y2="310.3828"/><polygon fill="#181818" points="217.7056,300.3828,221.7056,310.3828,225.7056,300.3828,221.7056,304.3828" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="221.7056" x2="221.7056" y1="363.3594" y2="383.3594"/><polygon fill="#181818" points="217.7056,373.3594,221.7056,383.3594,225.7056,373.3594,221.7056,377.3594" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="221.7056" x2="221.7056" y1="436.3359" y2="456.3359"/><polygon fill="#181818" points="217.7056,446.3359,221.7056,456.3359,225.7056,446.3359,221.7056,450.3359" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="221.7056" x2="221.7056" y1="492.8242" y2="512.8242"/><polygon fill="#181818" points="217.7056,502.8242,221.7056,512.8242,225.7056,502.8242,221.7056,506.8242" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="221.7056" x2="221.7056" y1="565.8008" y2="585.8008"/><polygon fill="#181818" points="217.7056,575.8008,221.7056,585.8008,225.7056,575.8008,221.7056,579.8008" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="221.7056" x2="221.7056" y1="638.7773" y2="658.7773"/><polygon fill="#181818" points="217.7056,648.7773,221.7056,658.7773,225.7056,648.7773,221.7056,652.7773" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="221.7056" x2="221.7056" y1="206.9531" y2="253.8945"/><polygon fill="#181818" points="217.7056,243.8945,221.7056,253.8945,225.7056,243.8945,221.7056,247.8945" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="221.7056" x2="221.7056" y1="695.2656" y2="727.2656"/><polygon fill="#181818" points="217.7056,717.2656,221.7056,727.2656,225.7056,717.2656,221.7056,721.2656" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="221.7056" x2="221.7056" y1="763.7539" y2="783.7539"/><polygon fill="#181818" points="217.7056,773.7539,221.7056,783.7539,225.7056,773.7539,221.7056,777.7539" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="221.7056" x2="221.7056" y1="123.9766" y2="170.4648"/><polygon fill="#181818" points="217.7056,160.4648,221.7056,170.4648,225.7056,160.4648,221.7056,164.4648" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="221.7056" x2="221.7056" y1="836.7305" y2="868.7305"/><polygon fill="#181818" points="217.7056,858.7305,221.7056,868.7305,225.7056,858.7305,221.7056,862.7305" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="221.7056" x2="221.7056" y1="905.2188" y2="958.6836"/><polygon fill="#181818" points="217.7056,948.6836,221.7056,958.6836,225.7056,948.6836,221.7056,952.6836" style="stroke:#181818;stroke-width:1;"/><g class="legend" data-source-line="39"><rect fill="#DDDDDD" height="141.9063" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="426.0352" x="137.9285" y="1036.1484"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="357.8135" x="142.9285" y="1054.6836">Graph = workflow definition: steps and connections.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="240.3994" x="142.9285" y="1071.1719">Run = one execution of that graph.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="286.3369" x="142.9285" y="1087.6602">Graph state = data passed between steps.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="378.376" x="142.9285" y="1104.1484">Agent session = conversation held by Codex or Claude.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="366.2559" x="142.9285" y="1120.6367">ACP = protocol used to communicate with that agent.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="142.9285" y="1137.125">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="416.0352" x="142.9285" y="1153.6133">Today, the existing ACP providers launch agents on the host.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="413.957" x="142.9285" y="1170.1016">Moving agent execution inside a VM is the proposed change.</text></g><!--SRC=[TLJ1RXCn4BtlLupA0P1A4L1KaQg74bgue5QqWailZdUoQzLh6zkRf20aFe8lv4juOsz3LC4f6tlcpSoRzvnDjamV_9ek0hiprnd7jFRnDb7shRgZtpz_KJ93i6Pfk2NUA7npaswD2oggWLAlMhyshgEbicdtfkMb6cq-zovVcMzCBmvtBfNEPcNotLkbRxleHzVElVMH7fszEtzrVlglI1zRZbFKwzT7Hs_UD4tAAkPcTYK_f2YEZlmI7rrKeJzk6a1aaurtjFTUZcQKCeT4sZl7EcCYuqWXIR3tw7j3130Ez696bv6Hpa0hX0Ib6OX4EvWbzEMCJZjscPnlkH2sH8iJK_iavF4Wzufqhrp7jGuglHsDRN4SeXz2fYL-AB6jZPKHqAxAA5l2BPBBwJEbm_q8iYZAFVzDLDBCZPkZcmrTVAAvLMEBHd8FdhkU379EvvUaMXKonmby7XcLX8kI3xYKCEEDUu9Xh5UjNF76f2oxdcvftREZoDglEEBywGHsnQujJKsJtPT6sIcYCbQLXXL8x9Rb6wUGdZ8w6XBGK_0E1UavHlMMnj2YqpG1xUWMvBOMSO7ZO6f_aR-Ed7AgaD9eR1Fn2iNl0Rv4Wxcb0TdVur8GiaLN8FR14duqMu6ycj4dg4tth6yBL3q-n36l3AyBOeK2XnhaBOHTZ-D8TJSWjkvcebpgWq4KcPqRPr9VCKPt39txq3J8nd_JzHdrhdi3wb9TIz5QxNOVEAArfTb03C44jY3d01bdIlVJHF0c3bFHWb-xoHN2qIGha9SafxW6VX5TsEHf4PNJg05lG2yrRryc4UjL5AnJd6ijsmFXwyBPkvq94pb6Ov22u5yKFkgv52aEZgrnAY8fuDtHgdXD8-IW4Lq92qrZkPC_2v-p7-uRfPEYegN5WrP6B3wT_NyyMU49UOY7Dwp7KWaFIEunMs5goq4L0O8XFZXMfOGX5fpNpDFW4dgwwnq4enoSaUe8FSFjYxk7sozvyEE9k2LxBH8NSCXF-s4OdL00UvZSryOAbuNQQtcZzujCjjOKA02j35wqHAY0VTKKhBewhVSfIzMFY496tSrV0enBHaH9dp-Am2OV1ozDrHUiBA9ku0y0]--></g></svg>