[tool.uv.workspace]
members = ["packages/*", "packages/adapters/*", "apps/*"]
# `packages/adapters` is a grouping directory, not a distribution.
exclude = ["packages/adapters"]

[dependency-groups]
# The adapters are no longer dependencies of any app -- apps resolve backends
# by name from plugins. Install them here so the dev venv can actually run one.
dev = [
    "pytest>=8.0",
    "engine-adapter-anthropic",
    "engine-adapter-scripted",
    "engine-adapter-openai",
]

[tool.uv.sources]
engine-adapter-anthropic = { workspace = true }
engine-adapter-scripted = { workspace = true }
engine-adapter-openai = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
