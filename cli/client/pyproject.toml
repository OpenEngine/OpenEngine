[project]
name = "engine-graph-cli"
version = "1.6.0"
description = "Terminal commands for registered graphs, runs, loops, nodes and the backends that serve them."
requires-python = ">=3.11"
# A client: it speaks HTTP to a backend and never starts a runtime itself.
dependencies = ["platformdirs>=4", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

# Editable installs read the repository workflow through the resource symlink.
# An sdist must carry its contents, since the repository is not shipped with it.
[tool.hatch.build.targets.sdist]
exclude = ["src/engine/cli/starters/default_graph.py.txt"]

[tool.hatch.build.targets.sdist.force-include]
"../../workflows/implementation_review_graph.py" = "src/engine/cli/starters/default_graph.py.txt"
