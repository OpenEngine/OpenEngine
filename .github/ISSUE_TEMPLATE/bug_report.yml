name: Bug report
description: Something did not work the way the docs say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. The more of this you can fill in, the faster we can fix it.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste the command and its output where you can.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. engine go "..."
        2. ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `engine --version` and `engine daemon doctor`, plus OS and which agent (claude, codex, opencode, ...) was running.
      render: shell
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Run ID, graph YAML, daemon log lines, screenshots.
