name: CLI compatibility

# The live half of the approval tests: real `codex` and `claude` binaries, real
# bidirectional protocol, real approve / cancel / allow-for-session decisions,
# against every release pinned in `.github/cli-versions.json`.
#
# Deliberately not a pull-request check. Everything here depends on somebody
# else's authentication, rate limits, model behaviour, and uptime, so a red run
# is as likely to mean "OpenAI had a bad ten minutes" as "we broke the approval
# contract". Blocking every unrelated PR on that trains people to ignore it.
# What *does* block a PR is the deterministic half -- protocol fixtures,
# normalization, API, and fake-provider end-to-end tests -- in `tests.yml`.
#
# Releasing approval functionality is gated on the most recent run of this
# workflow being green: see `release-gate.yml`.

on:
  workflow_dispatch:
  schedule:
    # Early Monday, so a week's provider releases are covered before anyone
    # depends on a green run to ship.
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: cli-compatibility
  cancel-in-progress: false

env:
  UV_VERSION: "0.9.28"
  # Every scenario is bounded twice: once on how long a provider may take to
  # ask for approval, and once on the whole turn. A hung CLI has to fail with
  # a sentence somebody can act on rather than by burning the job's six hours.
  ENGINE_COMPAT_PAUSE_TIMEOUT: "180"
  ENGINE_COMPAT_TURN_TIMEOUT: "300"

jobs:
  manifest:
    name: read the pinned releases
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - id: matrix
        name: Read the pinned releases
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(jq -c '{include: [
            (.codex[]   | {provider: "codex",  package: "@openai/codex",            version: .}),
            (.claude[]  | {provider: "claude", package: "@anthropic-ai/claude-code", version: .})
          ]}' .github/cli-versions.json)
          if [ "$matrix" = '{"include":[]}' ]; then
            echo "::error::.github/cli-versions.json pins no releases at all; there is nothing to test"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r 'def listed: if length == 0 then "none" else join(", ") end;
                 "pinned: codex \(.codex | listed) · claude \(.claude | listed)"' \
            .github/cli-versions.json >> "$GITHUB_STEP_SUMMARY"

  pinned:
    name: the matrix is fully pinned
    # Its own job, and not one the cells depend on: an incomplete manifest
    # should read as "we are not testing what we said we would" while whatever
    # *is* pinned still runs and reports. `cli-versions.yml` proposes the
    # change that fixes it; nothing edits the manifest automatically.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Every provider pins the full set
        shell: bash
        run: |
          set -euo pipefail
          wanted=$(jq -r '.policy.versions' .github/cli-versions.json)
          incomplete=$(jq -r --argjson wanted "$wanted" \
            'to_entries[] | select(.key | test("^(codex|claude)$"))
             | select((.value | length) != $wanted)
             | "\(.key) pins \(.value | length) of \($wanted)"' \
            .github/cli-versions.json)
          if [ -n "$incomplete" ]; then
            echo "::error::the compatibility matrix is not fully pinned: $incomplete"
            echo "::error::run the 'CLI version manifest' workflow, then review and merge the manifest change"
            exit 1
          fi

  compatibility:
    name: ${{ matrix.provider }} ${{ matrix.version }}
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Cells are independent: one provider's outage must not hide another's
      # regression, and an old release failing is a fact worth seeing next to a
      # new one passing.
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install workspace
        run: uv sync --locked --all-packages

      - name: Install the pinned CLI release
        run: npm install --global --prefix "$RUNNER_TEMP/agent-cli" "${{ matrix.package }}@${{ matrix.version }}"

      - name: Put the CLI on PATH
        run: echo "$RUNNER_TEMP/agent-cli/bin" >> "$GITHUB_PATH"

      - name: Record what is actually installed
        # What the CLI calls itself, not what we asked npm for: a package that
        # resolves to something else is exactly the kind of drift this matrix
        # exists to catch, and the version has to be in the log of a failure.
        shell: bash
        run: |
          set -euo pipefail
          installed=$(${{ matrix.provider }} --version)
          echo "::notice::${{ matrix.provider }} requested ${{ matrix.version }}, reports $installed"
          {
            echo "### ${{ matrix.provider }} ${{ matrix.version }}"
            echo ""
            echo '```'
            echo "$installed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure the runtime MCP transport still loads
        if: matrix.provider == 'codex'
        run: |
          codex \
            -c 'mcp_servers.workflow.command="python3"' \
            -c 'mcp_servers.workflow.args=["-m", "engine.runtime.terminal_mcp_server"]' \
            mcp get workflow

      - name: Configure the runtime MCP transport still loads
        if: matrix.provider == 'claude'
        run: claude --help | grep -- '--mcp-config'

      - name: Clean workspace for this cell
        # Recreated per cell rather than reused: a scenario that asserts a file
        # was *not* created is meaningless in a directory another cell wrote to.
        shell: bash
        run: rm -rf "$RUNNER_TEMP/compat" && mkdir -p "$RUNNER_TEMP/compat" "$RUNNER_TEMP/compat-artifacts"

      - name: Approve, cancel, and allow-for-session
        env:
          ENGINE_COMPAT_PROVIDER: ${{ matrix.provider }}
          ENGINE_COMPAT_VERSION: ${{ matrix.version }}
          ENGINE_COMPAT_WORKSPACE: ${{ runner.temp }}/compat
          ENGINE_COMPAT_ARTIFACTS: ${{ runner.temp }}/compat-artifacts
          # Provider credentials. Absent, the scenarios skip rather than fail:
          # an unauthenticated runner is a configuration fact, not a
          # compatibility result.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run pytest tests/test_cli_compatibility.py -m compatibility -v

      - name: Upload the redacted protocol transcript
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: transcript-${{ matrix.provider }}-${{ matrix.version }}
          path: ${{ runner.temp }}/compat-artifacts
          if-no-files-found: warn
          # Diagnostics, not archives: long enough to read after a Monday run.
          retention-days: 14

  acp-adapter:
    name: codex over ACP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The jobs above reach Codex by running the `codex` binary. `langgraph-acp`
    # reaches it over ACP, through an adapter that is a different package on a
    # different release cadence -- so nothing above would notice the handshake,
    # the session update shapes, or the capability names moving under it.
    #
    # Unpinned on purpose, matching `CODEX_ACP_COMMAND`: what this job is for is
    # finding out that the current adapter broke, which a pin would hide.
    defaults:
      run:
        working-directory: langgraph-acp
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record which adapter release this is
        # `npx --yes` resolves at run time, so the version that failed has to be
        # in the log of the failure rather than inferred from the date.
        shell: bash
        run: |
          set -euo pipefail
          version=$(npm view @agentclientprotocol/codex-acp version)
          echo "::notice::@agentclientprotocol/codex-acp resolves to $version"
          echo "### codex-acp $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Handshake and one turn over ACP
        env:
          # Absent, the turn skips and the handshake still runs: initialize is
          # answered before anyone is asked to authenticate, so protocol drift
          # is catchable without a credential.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run --locked pytest -m compatibility -v
