name: V2 tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v2:
    name: V2 tests (Linux, Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.14"
      UV_MANAGED_PYTHON: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Lint V2
        run: uvx --from ruff==0.17.0 ruff check v2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: v2/packages/contracts/tooling/package-lock.json
      - name: Install contracts tooling for Node validator regression tests
        run: npm ci
        working-directory: v2/packages/contracts/tooling
      # V2 has its own workspace and test configuration; root pytest omits it.
      - name: Test V2, including real NATS recovery
        run: uv run --project v2 --frozen pytest v2
