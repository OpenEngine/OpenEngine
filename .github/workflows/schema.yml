name: architecture documentation

on:
  push:
    # PR branches are handled only by pull_request, avoiding duplicate publication.
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'cli/**'
      - 'langgraph-acp/**'
      - 'npm/**'
      - 'site/**'
      - 'e2e/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/package_diagram.py'
      - 'tests/test_package_diagram.py'
      - 'docs/architecture/packages.*'
      - 'docs/architecture/architecture.md'
      - 'migrations/**'
      - 'alembic.ini'
      - 'scripts/document_schema.py'
      - 'scripts/schema_diagram.py'
      - 'tests/test_schema_diagram.py'
      - 'tests/test_schema_documentation.py'
      - '.github/scripts/**'
      - '.github/workflows/schema.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'cli/**'
      - 'langgraph-acp/**'
      - 'npm/**'
      - 'site/**'
      - 'e2e/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/package_diagram.py'
      - 'tests/test_package_diagram.py'
      - 'docs/architecture/packages.*'
      - 'docs/architecture/architecture.md'
      - 'migrations/**'
      - 'alembic.ini'
      - 'scripts/document_schema.py'
      - 'scripts/schema_diagram.py'
      - 'tests/test_schema_diagram.py'
      - 'tests/test_schema_documentation.py'
      - '.github/scripts/**'
      - '.github/workflows/schema.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      schema: ${{ steps.paths.outputs.schema }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            schema:
              - 'migrations/**'
              - 'alembic.ini'
              - 'scripts/document_schema.py'
              - 'scripts/schema_diagram.py'
              - 'tests/test_schema_diagram.py'
              - 'tests/test_schema_documentation.py'
              - '.github/scripts/**'
              - '.github/workflows/schema.yml'

  document:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.schema == 'true'
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schema
          POSTGRES_PASSWORD: schema
          POSTGRES_DB: schema
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U schema"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select comparison baseline
        id: baseline
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            let base = context.payload.pull_request?.base.sha;
            if (!base && context.ref.startsWith('refs/heads/')) {
              const pulls = await github.rest.pulls.list({owner, repo,
                head: `${owner}:${context.ref.slice(11)}`, state: 'open'});
              base = pulls.data[0]?.base.sha;
            }
            base ||= context.payload.before;
            if (!base || /^0+$/.test(base)) base = context.sha;
            core.setOutput('sha', base);
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: .schema-base
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.28'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install publication tooling
        run: npm ci --prefix .github/scripts
      - name: Typecheck and test publication
        run: npm test --prefix .github/scripts
      - name: Replay and inspect every revision
        run: >-
          uv run --no-project --with 'alembic>=1.16,<2' --with 'sqlalchemy>=2,<3'
          --with 'psycopg[binary]>=3,<4' python scripts/document_schema.py
          --postgres-url postgresql+psycopg://schema:schema@localhost:5432/schema
          --manifest schema-changes.json
      - name: Generate latest schema comparison
        run: >-
          uv run --no-project --with 'alembic>=1.16,<2' --with 'sqlalchemy>=2,<3'
          python scripts/schema_diagram.py --base-root .schema-base
      - name: Render schema PNG
        # Hosted Ubuntu runners can block Chromium's sandbox via AppArmor.
        run: |
          if [ "$(cat diagram-changes.json)" != '[]' ]; then
            npm exec --yes --package=@mermaid-js/mermaid-cli@12.0.0 -- mmdc -p .github/scripts/puppeteer-config.json -i docs/architecture/schema.mermaid -o docs/architecture/schema.png -s 2
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: schema-documentation
          path: |
            docs/schema
            docs/architecture/schema.mermaid
            docs/architecture/schema.png
      # Never execute fork code with a privileged pull_request_target token.
      # Commit as the bot app when it is configured: a push made with GITHUB_TOKEN
      # arrives as github-actions[bot], and GitHub holds every workflow run that
      # identity triggers on a pull request until a maintainer approves it.
      - name: Mint a bot token
        id: bot
        if: vars.BOT_APP_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Commit changed schemas and comment on open PRs
        id: publish
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.bot.outputs.token || github.token }}
          script: |
            const publish = require('./.github/scripts/dist/publish-schema.js').default;
            const sha = await publish({github, context, core});
            if (sha) core.setOutput('sha', sha);

  packages:
    needs: [changes, document]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && (needs.document.result == 'success' || needs.document.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Follow the schema commit when both jobs run, avoiding competing writes.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.document.outputs.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.28'
      - name: Generate latest package architecture
        run: uv run --no-project python scripts/package_diagram.py
      - name: Detect package changes
        id: changes
        run: echo "changed=$([ "$(cat package-changes.json)" != '[]' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: '22'
      - name: Render package PNG
        # Use the same runner-compatible browser settings as the schema render.
        run: |
          if [ "$(cat package-changes.json)" != '[]' ]; then
            npm exec --yes --package=@mermaid-js/mermaid-cli@12.0.0 -- mmdc -p .github/scripts/puppeteer-config.json -i docs/architecture/packages.mermaid -o docs/architecture/packages.png --size 2400 -s 2
          fi
      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          name: package-architecture
          path: |
            docs/architecture/packages.mermaid
            docs/architecture/packages.png
          if-no-files-found: error
      - name: Install publication tooling
        if: steps.changes.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: npm ci --prefix .github/scripts && npm test --prefix .github/scripts
      # Commit as the bot app for the same reason as the schema commit above.
      - name: Mint a bot token
        id: bot
        if: vars.BOT_APP_ID != '' && steps.changes.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Commit package diagram and comment on open PRs
        if: steps.changes.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/github-script@v9
        env:
          DOCUMENT_SHA: ${{ needs.document.outputs.sha }}
        with:
          github-token: ${{ steps.bot.outputs.token || github.token }}
          script: |
            const publish = require('./.github/scripts/dist/publish-schema.js').default;
            if (process.env.DOCUMENT_SHA) {
              context.sha = process.env.DOCUMENT_SHA;
              if (context.payload.pull_request) context.payload.pull_request.head.sha = context.sha;
            }
            await publish({github, context, core}, 'packages');
