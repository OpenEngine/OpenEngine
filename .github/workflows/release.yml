name: release

on:
  push:
    branches: [main]
  pull_request:
  # Publishes langgraph-acp alone, from a chosen ref, without cutting a release:
  # the first PyPI upload, or a re-run after a failed publish.
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag (vX.Y.Z) or full commit SHA on main to publish to PyPI
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read
      actions: read

  release-please:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  bundle:
    needs: release-please
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'pull_request' || needs.release-please.outputs.created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.28"
          python-version: "3.12"
      - run: npm --prefix apps/web ci
      - name: Build all wheels and application bundle
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha || github.sha }}
        run: uv run --no-project python scripts/build_release.py --commit "$RELEASE_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            dist/openengine-*.tar.gz
            dist/release-manifest.json
          if-no-files-found: error

  # The one-line installer on a clean runner of each supported OS, installing
  # the bundle this run built instead of a published release.
  install:
    needs: [release-please, bundle]
    if: ${{ always() && !cancelled() && needs.bundle.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release
      - name: Install and start OpenEngine
        env:
          OPENENGINE_RELEASE_URL: file://${{ runner.temp }}/release
        run: sh scripts/install.sh --no-browser
      - name: openengine and engine are on PATH and healthy
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          command -v openengine
          command -v engine
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4364/api/health)
          [ "$status" = 200 ] || { engine daemon logs; exit 1; }
      # Setup again (as an upgrade would), then the background service's
      # status and a graceful stop that leaves nothing answering.
      - name: engine daemon setup, status and stop
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          engine daemon setup --no-browser || { engine daemon logs; exit 1; }
          engine daemon status
          engine daemon doctor || true
          engine daemon stop
          if engine daemon status; then exit 1; fi
          if curl --silent --output /dev/null http://127.0.0.1:4364/api/health; then exit 1; fi
      - name: Running it again keeps the config
        env:
          OPENENGINE_RELEASE_URL: file://${{ runner.temp }}/release
        run: |
          set -eu
          config="$HOME/.config/openengine/engine.toml"
          echo "# edited by hand" >> "$config"
          before=$(cksum < "$config")
          sh scripts/install.sh --no-start
          [ "$(cksum < "$config")" = "$before" ]

  upload-release:
    needs: [release-please, bundle]
    if: github.event_name == 'push' && needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts/install.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: dist
      # GITHUB_TOKEN-created tags do not trigger another workflow. Upload here.
      - name: Attach application assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/openengine-*.tar.gz dist/release-manifest.json scripts/install.sh --clobber

  # Built without the PyPI credential: the build backend is third-party code, so
  # it is hash-locked and runs in a job that cannot request the OIDC token. The
  # publish job below only uploads the artifacts this job produced.
  build-langgraph-acp:
    needs: release-please
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && needs.release-please.outputs.created == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: langgraph-acp
    steps:
      # Check out main with full history and tags, never the requested ref: the
      # ref is verified against main before any of its code is checked out.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # Only a release tag (vX.Y.Z) or a full commit SHA, and in both cases the
      # commit must already be on main. This blocks publishing an unreviewed
      # branch, a PR ref, or a tag pushed onto a commit that main never merged.
      - name: Verify the ref is released code on main
        working-directory: .
        env:
          REF: ${{ inputs.ref || needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && git rev-parse -q --verify "refs/tags/$REF" >/dev/null; then
            sha=$(git rev-parse "refs/tags/$REF^{commit}")
          elif [[ "$REF" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$REF^{commit}" 2>/dev/null; then
            sha=$REF
          else
            echo "::error::'$REF' is not a release tag (vX.Y.Z) or a full commit SHA in this repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main"
            exit 1
          fi
          git checkout --quiet --detach "$sha"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.28"
      - run: uv build --no-sources --build-constraints build-constraints.txt --require-hashes --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: langgraph-acp-dist
          path: langgraph-acp/dist/*
          if-no-files-found: error

  publish-langgraph-acp:
    needs: build-langgraph-acp
    if: ${{ !cancelled() && needs.build-langgraph-acp.result == 'success' }}
    runs-on: ubuntu-latest
    # PyPI trusted publishing: the `pypi` environment and this workflow file are
    # what the project's trusted publisher on pypi.org names. No token is stored.
    # The environment's deployment branches must be limited to main (Settings >
    # Environments > pypi) so a copy of this workflow edited on another branch
    # cannot mint the token. Actions here are pinned to commit SHAs because they
    # run with id-token: write.
    environment:
      name: pypi
      url: https://pypi.org/project/langgraph-acp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: langgraph-acp-dist
          path: dist
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.28"
      - run: uv publish --trusted-publishing always dist/*
