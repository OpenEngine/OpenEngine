name: packaged release
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
      - uses: actions/upload-artifact@v4
        with:
          name: release-frontend
          path: apps/web/src/engine/apps/web/static
  release:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: release-frontend
          path: apps/web/src/engine/apps/web/static
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.7'
          python-version: '3.12.12'
      - name: Build native offline release
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          version=0.0.0
          case "$REF" in refs/tags/v*) version=${REF#refs/tags/v};; esac
          uv run --no-project --python 3.12.12 release/build.py --version "$version" --commit "$SOURCE_COMMIT" --output "$RUNNER_TEMP/bundle"
      - name: Test installed artifacts without the source checkout
        run: |
          cp release/smoke.py "$RUNNER_TEMP/smoke.py"
          mv "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE.hidden"
          cd "$RUNNER_TEMP"
          ./bundle/python/bin/python3 -I -B smoke.py ./bundle
      - name: Restore checkout for action cleanup
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          if [ -d "$GITHUB_WORKSPACE.hidden" ]; then mv "$GITHUB_WORKSPACE.hidden" "$GITHUB_WORKSPACE"; fi
      - name: Archive tested release
        working-directory: ${{ runner.temp }}
        run: |
          tar -czf openengine-${{ matrix.platform }}.tar.gz bundle
          shasum -a 256 openengine-${{ matrix.platform }}.tar.gz > openengine-${{ matrix.platform }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: openengine-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/openengine-*.tar.gz*
