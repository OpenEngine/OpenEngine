name: pages

# Builds the Docusaurus site in site/ and publishes it to GitHub Pages, which
# serves it at https://openengine.cc, with scripts/install.sh at /install.sh.
# The custom domain lives in Settings -> Pages; site/static/CNAME records it in the
# repository as well, so the domain is visible from a checkout.
# Pull requests run the build alone, so a page that fails to compile as MDX
# (such as a generated one) is caught before it reaches main.

on:
  push:
    branches: [main]
    paths: &site_paths
      - "site/**"
      - "scripts/install.sh"
      - "scripts/generate_cli_docs.py"
      - "cli/service/src/engine/graph_service/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths: *site_paths
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one in flight: the site that is
# live should always be the last commit that finished, not a half-uploaded one.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Served as https://openengine.cc/install.sh for `curl ... | sh`.
      - name: Publish the installer
        run: cp scripts/install.sh site/static/install.sh

      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/build

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deploy
        uses: actions/deploy-pages@v5
