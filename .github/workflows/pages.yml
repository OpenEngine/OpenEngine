name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        env:
          SIGNUP_ENDPOINT: ${{ vars.SIGNUP_ENDPOINT }}
        run: |
          mkdir -p _site
          cp docs/pages/index.html docs/pages/styles.css docs/pages/signup.js _site/
          node -e 'const fs = require("fs"); fs.writeFileSync("_site/config.js", `window.OPENENGINE_CONFIG = ${JSON.stringify({ signupEndpoint: process.env.SIGNUP_ENDPOINT || "" })};\n`);'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
