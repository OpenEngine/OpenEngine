name: pages

# Builds the Docusaurus site in site/ and publishes it to GitHub Pages, which
# serves it at https://openengine.sh.
# The custom domain lives in Settings -> Pages; site/static/CNAME records it in the
# repository as well, so the domain is visible from a checkout.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: the site that is
# live should always be the last commit that finished, not a half-uploaded one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/build

      - id: deploy
        uses: actions/deploy-pages@v5
