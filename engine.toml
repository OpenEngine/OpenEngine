[approvals]
auto_approve = false
allow = ["read", "edit"]

[approvals.bash]
allow = [
  ".venv/bin/python -m pytest tests/**",
  "uv run pytest **",
  "mkdir **",
  "git add **",
  "git commit **",
  "git checkout **",
  "git switch -c **",
  "git push **",
  "gh auth status **",
  "gh pr create **",
  "gh pr list **",
]
