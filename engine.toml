[approvals]
auto_approve = true
allow = ["read", "edit", "bash"]

[approvals.bash]
allow = [
  ".venv/bin/python -m pytest tests/**",
  "uv run pytest **",
  "mkdir **",
  "git add **",
  "git commit **",
  "git checkout **",
  "git switch **",
  "git push **",
  "gh auth status **",
  "gh pr create **",
]
