[project]
name = "openengine-telemetry"
version = "0.0.0"
description = "The logging and tracing layer OpenEngine V2's services share: JSON lines locally, OTLP to one endpoint."
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-sdk>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openengine"]
