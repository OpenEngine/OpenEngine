<script id="contract" type="application/json">{"asyncapi":"3.1.0","id":"urn:openengine:v2:virtual-control-plane","info":{"title":"OpenEngine Virtual Control Plane (vcp)","version":"1.0.0-draft.2","description":"The Virtual Control Plane manages workspaces (where agents work), the\ncompute runtimes behind them, and the agent sessions and task attempts\ninside them. This document describes the NATS interface **VCP serves**: the\ncommands and queries it answers and the events it publishes.\n\n> **Contract only.** These subjects are a defined API, not an\n> implemented one. No VCP handler answers them yet; see the package\n> README's *Implementation status*.\n\n## Versions\n- AsyncAPI format: `3.1.0` (the `asyncapi` field).\n- Contract release: `info.version`, semver. Minor releases only add.\n- Subject namespace: `v1` in `oe.v1.vcp.…`. It\n  changes only for an incompatible release, which is served side by side.\n- Resource apiVersion: `openengine.cc/v1alpha1` for every kind. Its\n  `v1` is the subject namespace's; `alpha1` changes while `v1` is a draft.\n\n## Request/reply\nControl and query subjects use native NATS request/reply: the reply goes\nto the request's reply inbox, and payloads carry no `replyTo`. Every\nreply is a typed response, including rejections.\n\n- **Control** (`oe.v1.vcp.control.…`): `accepted` means the command is\n  durably recorded with an operation; it does not mean it is done.\n  Completion is reported by the operation query\n  (`oe.v1.vcp.query.operations.{operation_id}.get`) and by the lifecycle\n  event that carries the command's `operation` reference.\n- **Query** (`oe.v1.vcp.query.…`): read-only, creates no operation.\n- A request that times out has an **unknown** outcome. Retry with the\n  same `command_id`.\n\n## Idempotency\nA retry with the same `command_id` and identical subject, payload,\n`expected_version` and `causal_path` returns the original response and\noperation ID. The same `command_id` with anything else is rejected with\n`COMMAND_ID_CONFLICT`. Command IDs are remembered for at least **7 days**.\nNon-retryable rejections are remembered and replayed; retryable ones\n(`UNAVAILABLE`) are not.\n\n## Identity\nThe acting identity comes from the authenticated NATS connection (or a\nverified delegation), never from a payload field.\n\n## Identities and states\n- `workspace_id` is stable for the workspace's whole life.\n- `runtime_id` names one compute runtime; `runtime_generation` counts\n  them. Every restoration creates a new runtime and generation.\n- `session_id` names an agent conversation; `attempt_id` one task attempt\n  started by `execute`.\n- Workspace lifecycle state (`provisioning` … `destroyed`, `failed`) is\n  separate from attempt state (`starting` … `cancelled`). A failed task\n  never fails its workspace.\n\n## Apply\nWorkspaces are created by applying a Workspace resource (`kind:\nWorkspace`, `apiVersion: openengine.cc/v1alpha1`; see `resources/`),\nkeyed by its `metadata.name`. The Graph Engine chooses the name before\nthe workspace runs anything, so tool grants can refer to it. VCP\nallocates the `ws_…` ID that every subject and event uses.\n\n## Restoration\n`ensure`, `execute` and `steer` restore a suspended workspace themselves\nwhen `restore` is `allow` (the default) and the provider can restore it;\nwith `forbid` they are rejected with `INVALID_STATE` instead. Capabilities\nare reported explicitly by `capabilities.get`; a request needing one a\nprovider lacks is rejected with `UNSUPPORTED_CAPABILITY`, never\napproximated.\n\n## Cancellation and destruction\nThey are different operations:\n- **cancel** stops one task attempt (`attempt_id` is required). The\n  workspace, its runtime and its sessions remain. The attempt ends\n  `cancelled` (`task.cancelled`), or keeps its own outcome if it finished\n  first.\n- **destroy** disposes of the workspace and its compute under an explicit\n  `retention` policy for artifacts and checkpoints. It is rejected with\n  `INVALID_STATE` while any attempt is active and never cancels work\n  implicitly. To destroy a busy workspace: `cancel`, wait for\n  `task.cancelled`, then `destroy`.\n\n## Suspension\n**suspend** releases compute and keeps restoration state. It requires the\nprovider's `suspend` capability. With `if_active: reject` (default) it is\nrefused while an attempt is active; `checkpoint_and_cancel` checkpoints,\ncancels active attempts (each reported by `task.cancelled`), then\nsuspends, and is only accepted when the provider can checkpoint.\n\n## Runtime approvals\nRuntime approvals are raised by an agent runner and owned by VCP (GE\nworkflow approvals are separate). Each is bound to a workspace, session,\nattempt and runtime generation, and keeps the runner's own approval\nhandle so the decision can be delivered. A decision must restate that\nbinding. A decision for an approval that is already decided, expired,\nbound to an older runtime generation, or bound differently is rejected\nwith `STALE_APPROVAL`. Pending approvals that cannot be carried safely\nacross a restoration expire (`approval.expired`) rather than being\ndelivered to a runtime that never asked.\n\n## Failures\nWorkspace failure (`workspace.failed`), task failure (`task.failed`) and\noperation failure (an operation with status `failed`) are separate facts.\n\n## Out of scope\nWorkspace-daemon wire contracts and subjects are not part of this\ncontract.\n","license":{"name":"Apache-2.0"}},"defaultContentType":"application/json","servers":{"local":{"host":"localhost:4222","protocol":"nats","description":"The NATS server `oe up` starts."}},"channels":{"workspacesApply":{"address":"oe.v1.vcp.control.workspaces.apply","title":"Apply a workspace","messages":{"ApplyWorkspaceCommand":{"$ref":"#/components/messages/ApplyWorkspaceCommand"}}},"workspaceEnsure":{"address":"oe.v1.vcp.control.workspaces.{workspace_id}.ensure","title":"Ensure a workspace is available","parameters":{"workspace_id":{"$ref":"#/components/parameters/work
