    messages:
      ArtifactCreated: { $ref: '#/components/messages/ArtifactCreated' }
operations:
  applyWorkspace:
    action: receive
    title: Apply a workspace
    summary: Create or update a workspace from a Workspace resource, by its `metadata.name`.
    description: Accepted once recorded; `resource_id` is the workspace ID, allocated when the name is new.
      Rejected with `UNSUPPORTED_CAPABILITY` when the provider lacks a required capability, and with `INVALID_ARGUMENT`
      when an update changes `provider`, `resources` or `requiredCapabilities`. A new workspace completes with
      `workspace.ready` (or `workspace.failed`).
    channel: { $ref: '#/channels/workspacesApply' }
    tags:
    - name: control
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/ApplyWorkspaceResponse'
  ensureWorkspace:
    action: receive
    title: Ensure a workspace is available
    summary: Make compute available, restoring a suspended workspace when permitted and supported.
    description: Completes with `workspace.restored` or immediately when already ready.
    channel: { $ref: '#/channels/workspaceEnsure' }
    tags:
    - name: control
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/EnsureWorkspaceResponse'
  executeTask:
    action: receive
    title: Execute a task
    summary: Start a task attempt with an agent configuration and session policy; restores compute internally
      when permitted.
    description: '`resource_id` is the new attempt ID. The operation succeeds when the attempt starts
      (`task.started`); the attempt''s outcome is reported by `task.completed`, `task.failed` or `task.cancelled`.'
    channel: { $ref: '#/channels/workspaceExecute' }
    tags:
    - name: control
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/ExecuteResponse'
  steerSession:
    action: receive
    title: Steer a session
    summary: Deliver a message to a named session; restores compute when permitted.
    description: Completes with `steering.applied` or `steering.failed`.
    channel: { $ref: '#/channels/workspaceSteer' }
    tags:
    - name: control
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/SteerResponse'
  cancelAttempt:
    action: receive
    title: Cancel a task attempt
    summary: Stop one task attempt (`attempt_id` required). The workspace is retained.
    description: Completes with `task.cancelled`, or with the attempt's own outcome if it ended first.
      Never destroys anything.
    channel: { $ref: '#/channels/workspaceCancel' }
    tags:
    - name: control
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/CancelResponse'
  checkpointWorkspace:
    action: receive
    title: Checkpoint a workspace
    summary: Capture supported restoration state.
    description: Rejected with `UNSUPPORTED_CAPABILITY` when the provider cannot checkpoint. Completes
      with `workspace.checkpointed`.
    channel: { $ref: '#/channels/workspaceCheckpoint' }
    tags:
    - name: control
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/CheckpointResponse'
  suspendWorkspace:
    action: receive
    title: Suspend a workspace
    summary: Release compute while retaining restoration state.
    description: Rejected with `INVALID_STATE` while an attempt is active unless `if_active` is `checkpoint_and_cancel`;
      with `UNSUPPORTED_CAPABILITY` when the provider cannot suspend. Completes with `workspace.suspended`.
    channel: { $ref: '#/channels/workspaceSuspend' }
    tags:
    - name: control
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/SuspendResponse'
  destroyWorkspace:
    action: receive
    title: Destroy a workspace
    summary: Dispose of the workspace and its compute under an explicit retention policy.
    description: 'Rejected with `INVALID_STATE` while any attempt is active: cancel and wait for `task.cancelled`
      first. Completes with `workspace.destroyed`.'
    channel: { $ref: '#/channels/workspaceDestroy' }
    tags:
    - name: control
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/DestroyResponse'
  decideApproval:
    action: receive
    title: Decide a runtime approval
    summary: Resolve a runtime approval bound to a workspace, session, attempt and runtime generation.
    description: Rejected with `STALE_APPROVAL` when the approval is decided, expired, bound to an older
      runtime generation, or bound differently. Completes with `approval.resolved`.
    channel: { $ref: '#/channels/approvalDecide' }
    tags:
    - name: control
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/DecideApprovalResponse'
  getCapabilities:
    action: receive
    title: Get provider capabilities
    summary: Report each provider's isolation, checkpoint, suspend and restore capabilities, limits and
      tools.
    channel: { $ref: '#/channels/capabilitiesGet' }
    tags:
    - name: query
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/GetCapabilitiesResponse'
  listWorkspaces:
    action: receive
    title: List workspaces
    summary: Page through workspaces by state, provider and job.
    channel: { $ref: '#/channels/workspacesList' }
    tags:
    - name: query
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/ListWorkspacesResponse'
  getWorkspace:
    action: receive
    title: Get a workspace
    summary: Return one workspace's lifecycle state, runtime and active attempts.
    channel: { $ref: '#/channels/workspaceGet' }
    tags:
    - name: query
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/GetWorkspaceResponse'
  listSessions:
    action: receive
    title: List a workspace's sessions
    summary: Page through the sessions of one workspace, each with its recent attempts.
    channel: { $ref: '#/channels/workspaceSessionsList' }
    tags:
    - name: query
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/ListSessionsResponse'
  listApprovals:
    action: receive
    title: List a workspace's runtime approvals
    summary: Page through runtime approvals of one workspace.
    channel: { $ref: '#/channels/workspaceApprovalsList' }
    tags:
    - name: query
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/ListApprovalsResponse'
  listArtifacts:
    action: receive
    title: List a workspace's artifacts
    summary: Page through artifacts produced in one workspace.
    channel: { $ref: '#/channels/workspaceArtifactsList' }
    tags:
    - name: query
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/ListArtifactsResponse'
  getSession:
    action: receive
    title: Get a session
    summary: Return one session with its recent attempts.
    channel: { $ref: '#/channels/sessionGet' }
    tags:
    - name: query
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages:
      - $ref: '#/channels/replyInbox/messages/GetSessionResponse'
  listSessionEvents:
    action: receive
    title: List a session's history
    summary: Page through a session's messages, tool calls, steering and usage in sequence order.
