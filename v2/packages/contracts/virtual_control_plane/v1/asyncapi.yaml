    channel: { $ref: '#/channels/workspaceRestoredEvents' }
    tags:
    - name: event
  publishWorkspaceCheckpointed:
    action: send
    title: workspace.checkpointed
    summary: Restoration state was captured.
    channel: { $ref: '#/channels/workspaceCheckpointedEvents' }
    tags:
    - name: event
  publishWorkspaceSuspended:
    action: send
    title: workspace.suspended
    summary: Compute was released; restoration state kept.
    channel: { $ref: '#/channels/workspaceSuspendedEvents' }
    tags:
    - name: event
  publishWorkspaceDestroyed:
    action: send
    title: workspace.destroyed
    summary: The workspace and its compute were disposed of.
    channel: { $ref: '#/channels/workspaceDestroyedEvents' }
    tags:
    - name: event
  publishWorkspaceFailed:
    action: send
    title: workspace.failed
    summary: The environment failed. Not a task failure.
    channel: { $ref: '#/channels/workspaceFailedEvents' }
    tags:
    - name: event
  publishTaskStarted:
    action: send
    title: task.started
    summary: A task attempt started; completes its execute operation.
    channel: { $ref: '#/channels/taskStartedEvents' }
    tags:
    - name: event
  publishTaskCompleted:
    action: send
    title: task.completed
    summary: A task attempt finished successfully.
    channel: { $ref: '#/channels/taskCompletedEvents' }
    tags:
    - name: event
  publishTaskFailed:
    action: send
    title: task.failed
    summary: A task attempt failed. The workspace stays usable.
    channel: { $ref: '#/channels/taskFailedEvents' }
    tags:
    - name: event
  publishTaskCancelled:
    action: send
    title: task.cancelled
    summary: A task attempt was cancelled. The workspace stays.
    channel: { $ref: '#/channels/taskCancelledEvents' }
    tags:
    - name: event
  publishApprovalRequested:
    action: send
    title: approval.requested
    summary: An agent runner asked for approval.
    channel: { $ref: '#/channels/approvalRequestedEvents' }
    tags:
    - name: event
  publishApprovalResolved:
    action: send
    title: approval.resolved
    summary: A runtime approval was decided and delivered.
    channel: { $ref: '#/channels/approvalResolvedEvents' }
    tags:
    - name: event
  publishApprovalExpired:
    action: send
    title: approval.expired
    summary: A runtime approval can no longer be decided.
    channel: { $ref: '#/channels/approvalExpiredEvents' }
    tags:
    - name: event
  publishSteeringApplied:
    action: send
    title: steering.applied
    summary: A steering message reached its session.
    channel: { $ref: '#/channels/steeringAppliedEvents' }
    tags:
    - name: event
  publishSteeringFailed:
    action: send
    title: steering.failed
    summary: A steering message could not be delivered.
    channel: { $ref: '#/channels/steeringFailedEvents' }
    tags:
    - name: event
  publishConversationMessage:
    action: send
    title: conversation.message
