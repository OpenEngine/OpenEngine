asyncapi: 3.1.0
id: urn:openengine:v2:virtual-control-plane
info:
  title: OpenEngine Virtual Control Plane (vcp)
  version: 1.0.0-draft.2
  description: |
    The Virtual Control Plane manages workspaces (where agents work), the
    compute runtimes behind them, and the agent sessions and task attempts
    inside them. This document describes the NATS interface **VCP serves**: the
    commands and queries it answers and the events it publishes.

    > **Contract only.** These subjects are a defined API, not an
    > implemented one. No VCP handler answers them yet; see the package
    > README's *Implementation status*.

    ## Versions
    - AsyncAPI format: `3.1.0` (the `asyncapi` field).
    - Contract release: `info.version`, semver. Minor releases only add.
    - Subject namespace: `v1` in `oe.v1.vcp.…`. It
      changes only for an incompatible release, which is served side by side.
    - Resource apiVersion: `openengine.cc/v1alpha1` for every kind. Its
      `v1` is the subject namespace's; `alpha1` changes while `v1` is a draft.

    ## Request/reply
    Control and query subjects use native NATS request/reply: the reply goes
    to the request's reply inbox, and payloads carry no `replyTo`. Every
    reply is a typed response, including rejections.

    - **Control** (`oe.v1.vcp.control.…`): `accepted` means the command is
      durably recorded with an operation; it does not mean it is done.
      Completion is reported by the operation query
      (`oe.v1.vcp.query.operations.{operation_id}.get`) and by the lifecycle
      event that carries the command's `operation` reference.
    - **Query** (`oe.v1.vcp.query.…`): read-only, creates no operation.
    - A request that times out has an **unknown** outcome. Retry with the
      same `command_id`.

    ## Idempotency
    A retry with the same `command_id` and identical subject, payload,
    `expected_version` and `causal_path` returns the original response and
    operation ID. The same `command_id` with anything else is rejected with
    `COMMAND_ID_CONFLICT`. Command IDs are remembered for at least **7 days**.
    Non-retryable rejections are remembered and replayed; retryable ones
    (`UNAVAILABLE`) are not.

    ## Identity
    The acting identity comes from the authenticated NATS connection (or a
    verified delegation), never from a payload field.

    ## Identities and states
    - `workspace_id` is stable for the workspace's whole life.
    - `runtime_id` names one compute runtime; `runtime_generation` counts
      them. Every restoration creates a new runtime and generation.
    - `session_id` names an agent conversation; `attempt_id` one task attempt
      started by `execute`.
    - Workspace lifecycle state (`provisioning` … `destroyed`, `failed`) is
      separate from attempt state (`starting` … `cancelled`). A failed task
      never fails its workspace.

    ## Apply
    Workspaces are created by applying a Workspace resource (`kind:
    Workspace`, `apiVersion: openengine.cc/v1alpha1`; see `resources/`),
    keyed by its `metadata.name`. The Graph Engine chooses the name before
    the workspace runs anything, so tool grants can refer to it. VCP
    allocates the `ws_…` ID that every subject and event uses.

    ## Restoration
    `ensure`, `execute` and `steer` restore a suspended workspace themselves
    when `restore` is `allow` (the default) and the provider can restore it;
    with `forbid` they are rejected with `INVALID_STATE` instead. Capabilities
    are reported explicitly by `capabilities.get`; a request needing one a
    provider lacks is rejected with `UNSUPPORTED_CAPABILITY`, never
    approximated.

    ## Cancellation and destruction
    They are different operations:
    - **cancel** stops one task attempt (`attempt_id` is required). The
      workspace, its runtime and its sessions remain. The attempt ends
      `cancelled` (`task.cancelled`), or keeps its own outcome if it finished
      first.
    - **destroy** disposes of the workspace and its compute under an explicit
      `retention` policy for artifacts and checkpoints. It is rejected with
      `INVALID_STATE` while any attempt is active and never cancels work
      implicitly. To destroy a busy workspace: `cancel`, wait for
      `task.cancelled`, then `destroy`.

    ## Suspension
    **suspend** releases compute and keeps restoration state. It requires the
    provider's `suspend` capability. With `if_active: reject` (default) it is
    refused while an attempt is active; `checkpoint_and_cancel` checkpoints,
    cancels active attempts (each reported by `task.cancelled`), then
    suspends, and is only accepted when the provider can checkpoint.

    ## Runtime approvals
    Runtime approvals are raised by an agent runner and owned by VCP (GE
    workflow approvals are separate). Each is bound to a workspace, session,
    attempt and runtime generation, and keeps the runner's own approval
    handle so the decision can be delivered. A decision must restate that
    binding. A decision for an approval that is already decided, expired,
    bound to an older runtime generation, or bound differently is rejected
    with `STALE_APPROVAL`. Pending approvals that cannot be carried safely
    across a restoration expire (`approval.expired`) rather than being
    delivered to a runtime that never asked.

    ## Failures
    Workspace failure (`workspace.failed`), task failure (`task.failed`) and
    operation failure (an operation with status `failed`) are separate facts.

    ## Out of scope
    Workspace-daemon wire contracts and subjects are not part of this
    contract.
  license:
    name: Apache-2.0
defaultContentType: application/json
servers:
  local:
    host: localhost:4222
    protocol: nats
    description: The NATS server `oe up` starts.
channels:
  workspacesApply:
    address: oe.v1.vcp.control.workspaces.apply
    title: Apply a workspace
    messages:
      ApplyWorkspaceCommand: { $ref: '#/components/messages/ApplyWorkspaceCommand' }
  workspaceEnsure:
    address: oe.v1.vcp.control.workspaces.{workspace_id}.ensure
    title: Ensure a workspace is available
    parameters:
      workspace_id: { $ref: '#/components/parameters/workspace_id' }
    messages:
      EnsureWorkspaceCommand: { $ref: '#/components/messages/EnsureWorkspaceCommand' }
  workspaceExecute:
    address: oe.v1.vcp.control.workspaces.{workspace_id}.execute
    title: Execute a task
    parameters:
      workspace_id: { $ref: '#/components/parameters/workspace_id' }
    messages:
      ExecuteCommand: { $ref: '#/components/messages/ExecuteCommand' }
  workspaceSteer:
