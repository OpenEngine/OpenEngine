  workspaceCheckpointedEvents:
    address: oe.v1.vcp.events.workspaces.{workspace_id}.workspace.checkpointed
    title: workspace.checkpointed
    parameters:
      workspace_id: { $ref: '#/components/parameters/workspace_id' }
