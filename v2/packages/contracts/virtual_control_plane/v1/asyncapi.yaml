      x-oe-identifier: workspace_id
    approval_id:
      description: Runtime approval ID, a single subject token `rtappr_…`.
      x-oe-identifier: runtime_approval_id
    session_id:
      description: Session ID, a single subject token `session_…`.
      x-oe-identifier: session_id
    operation_id:
      description: Operation ID, a single subject token `op_…`.
      x-oe-identifier: operation_id
