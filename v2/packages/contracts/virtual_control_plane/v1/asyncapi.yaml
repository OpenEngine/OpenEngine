  approvalExpiredEvents:
    address: oe.v1.vcp.events.workspaces.{workspace_id}.approval.expired
    title: approval.expired
    parameters:
      workspace_id: { $ref: '#/components/parameters/workspace_id' }
    messages:
      ApprovalExpired: { $ref: '#/components/messages/ApprovalExpired' }
  steeringAppliedEvents:
    address: oe.v1.vcp.events.workspaces.{workspace_id}.steering.applied
    title: steering.applied
