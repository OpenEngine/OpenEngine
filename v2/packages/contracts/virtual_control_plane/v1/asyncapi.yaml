        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: ./schemas/commands.schema.json#/$defs/apply_workspace_command }
      examples:
      - name: apply
        summary: GE applies a named workspace for a step attempt of job_88. The path extends the job's ancestry.
        payload: { $ref: ./examples/workspaces.apply.command.json#/payload }
    ApplyWorkspaceResponse:
      name: ApplyWorkspaceResponse
      title: Apply a workspace response
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: ./schemas/commands.schema.json#/$defs/workspace_command_response }
      examples:
      - name: accepted
        summary: 'Accepted: workspace ID allocated, provisioning continues.'
        payload: { $ref: ./examples/workspaces.apply.response.accepted.json#/payload }
      - name: rejected-unsupported
        summary: 'Rejected: the requested provider lacks a required capability.'
        payload: { $ref: ./examples/workspaces.apply.response.unsupported.json#/payload }
    EnsureWorkspaceCommand:
      name: EnsureWorkspaceCommand
      title: Ensure a workspace is available command
      traits:
      - $ref: '#/components/messageTraits/commandHeaders'
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: ./schemas/commands.schema.json#/$defs/ensure_workspace_command }
      examples:
      - name: ensure
        payload: { $ref: ./examples/workspaces.ensure.command.json#/payload }
    EnsureWorkspaceResponse:
      name: EnsureWorkspaceResponse
      title: Ensure a workspace is available response
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: ./schemas/commands.schema.json#/$defs/workspace_command_response }
      examples:
      - name: accepted
        payload: { $ref: ./examples/workspaces.ensure.response.json#/payload }
    ExecuteCommand:
      name: ExecuteCommand
      title: Execute a task command
      traits:
      - $ref: '#/components/messageTraits/commandHeaders'
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: ./schemas/commands.schema.json#/$defs/execute_command }
      examples:
      - name: execute-branch-a
        summary: One of two sibling commands GE sends for parallel steps; both paths share the prefix
          [gh-conn_acme_gh-dlv_88, cmd_submit_88].
        payload: { $ref: ./examples/workspaces.execute.command.json#/payload }
      - name: execute-branch-b
        summary: The sibling branch, in another workspace.
        payload: { $ref: ./examples/workspaces.execute.command.branch-b.json#/payload }
      - name: execute-retry
        summary: 'Identical retry after a timeout: same command ID, path and payload. VCP replies with
