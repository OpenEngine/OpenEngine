    parameters:
      workspace_id: { $ref: '#/components/parameters/workspace_id' }
    messages:
      WorkspaceSuspended: { $ref: '#/components/messages/WorkspaceSuspended' }
  workspaceDestroyedEvents:
    address: oe.v1.vcp.events.workspaces.{workspace_id}.workspace.destroyed
    title: workspace.destroyed
    parameters:
      workspace_id: { $ref: '#/components/parameters/workspace_id' }
    messages:
      WorkspaceDestroyed: { $ref: '#/components/messages/WorkspaceDestroyed' }
  workspaceFailedEvents:
    address: oe.v1.vcp.events.workspaces.{workspace_id}.workspace.failed
    title: workspace.failed
    parameters:
      workspace_id: { $ref: '#/components/parameters/workspace_id' }
    messages:
      WorkspaceFailed: { $ref: '#/components/messages/WorkspaceFailed' }
  taskStartedEvents:
    address: oe.v1.vcp.events.workspaces.{workspace_id}.task.started
    title: task.started
    parameters:
      workspace_id: { $ref: '#/components/parameters/workspace_id' }
    messages:
      TaskStarted: { $ref: '#/components/messages/TaskStarted' }
  taskCompletedEvents:
    address: oe.v1.vcp.events.workspaces.{workspace_id}.task.completed
    title: task.completed
    parameters:
      workspace_id: { $ref: '#/components/parameters/workspace_id' }
    messages:
      TaskCompleted: { $ref: '#/components/messages/TaskCompleted' }
  taskFailedEvents:
    address: oe.v1.vcp.events.workspaces.{workspace_id}.task.failed
    title: task.failed
    parameters:
      workspace_id: { $ref: '#/components/parameters/workspace_id' }
