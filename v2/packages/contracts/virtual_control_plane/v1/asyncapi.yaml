      CheckpointResponse: { $ref: '#/components/messages/CheckpointResponse' }
      SuspendResponse: { $ref: '#/components/messages/SuspendResponse' }
      DestroyResponse: { $ref: '#/components/messages/DestroyResponse' }
      DecideApprovalResponse: { $ref: '#/components/messages/DecideApprovalResponse' }
      GetCapabilitiesResponse: { $ref: '#/components/messages/GetCapabilitiesResponse' }
      ListWorkspacesResponse: { $ref: '#/components/messages/ListWorkspacesResponse' }
      GetWorkspaceResponse: { $ref: '#/components/messages/GetWorkspaceResponse' }
      ListSessionsResponse: { $ref: '#/components/messages/ListSessionsResponse' }
      ListApprovalsResponse: { $ref: '#/components/messages/ListApprovalsResponse' }
      ListArtifactsResponse: { $ref: '#/components/messages/ListArtifactsResponse' }
      GetSessionResponse: { $ref: '#/components/messages/GetSessionResponse' }
      ListSessionEventsResponse: { $ref: '#/components/messages/ListSessionEventsResponse' }
      GetOperationResponse: { $ref: '#/components/messages/GetOperationResponse' }
  workspaceProvisioningEvents:
    address: oe.v1.vcp.events.workspaces.{workspace_id}.workspace.provisioning
    title: workspace.provisioning
    parameters:
      workspace_id: { $ref: '#/components/parameters/workspace_id' }
    messages:
      WorkspaceProvisioning: { $ref: '#/components/messages/WorkspaceProvisioning' }
  workspaceReadyEvents:
    address: oe.v1.vcp.events.workspaces.{workspace_id}.workspace.ready
    title: workspace.ready
    parameters:
      workspace_id: { $ref: '#/components/parameters/workspace_id' }
    messages:
      WorkspaceReady: { $ref: '#/components/messages/WorkspaceReady' }
  workspaceRestoredEvents:
    address: oe.v1.vcp.events.workspaces.{workspace_id}.workspace.restored
    title: workspace.restored
    parameters:
      workspace_id: { $ref: '#/components/parameters/workspace_id' }
    messages:
