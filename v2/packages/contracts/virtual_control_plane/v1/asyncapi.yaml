    title: NATS reply inbox
    description: The requester's reply subject, set by NATS request/reply. Never named in a payload.
    messages:
      ApplyWorkspaceResponse: { $ref: '#/components/messages/ApplyWorkspaceResponse' }
      EnsureWorkspaceResponse: { $ref: '#/components/messages/EnsureWorkspaceResponse' }
