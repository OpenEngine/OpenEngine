      CheckpointCommand: { $ref: '#/components/messages/CheckpointCommand' }
  workspaceSuspend:
    address: oe.v1.vcp.control.workspaces.{workspace_id}.suspend
    title: Suspend a workspace
    parameters:
      workspace_id: { $ref: '#/components/parameters/workspace_id' }
