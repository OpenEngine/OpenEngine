      SuspendCommand: { $ref: '#/components/messages/SuspendCommand' }
  workspaceDestroy:
    address: oe.v1.vcp.control.workspaces.{workspace_id}.destroy
    title: Destroy a workspace
    parameters:
      workspace_id: { $ref: '#/components/parameters/workspace_id' }
    messages:
