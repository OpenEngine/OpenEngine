 and invocation ID | cancellation accepted |\n\nExecution workers answer `oe.v1.tools.invoke.*.*` as one queue group,\n`tool-workers`. Lifecycle events are published on\n`oe.v1.events.toolinvocations.{namespace}.{invocation_id}.{event}` and\ncaptured by the `tools-events` stream.\n\nCommands use the shared command envelope and queries the shared query\nenvelope; payload fields are camelCase, like the resources they carry.\n`accepted` means durably recorded; the tool service has no operation\nquery, so events and `get` report what happened.\n\n## Names\nA namespace and a resource name each occupy one subject token:\nlower-case letters, digits and `-`, with no `.` or wildcards, such as\n`oe.v1.tools.invoke.default.github-issue-comment`. A namespace groups\nresources; naming alone does not isolate tenants.\n\n## Tools\nEach Tool is a capability bound to one Connection, so an agent never\npicks the connection, and the adapter's trusted `configuration` cannot be\noverridden by arguments. Applying a Tool asks its adapter to validate it\nand rejects a `recovery` the adapter does not implement.\n\n## Grants\n- Only trusted control-plane callers may apply or delete grants. The\n  Graph Engine is the usual one: a Graph step's `agent.tools` lists the\n  tools (`namespace.name`) it may call. Once a step attempt has its\n  workspace, and before the attempt is sent to run there, the Graph\n  Engine applies a grant for each tool to that attempt in that\n  workspace; it deletes them when the attempt ends.\n- Grants and invocations name the workspace by its Workspace name\n  (`workspaceRef`) and the step attempt by the Graph Engine's ID\n  (`stepAttemptId`, `stepa_…`).\n\n## Availability\nThe Graph Engine applies grants before every step that lists tools, and\nagents invoke tools while steps run, so the tool service is on the\ncritical path of graph execution and must be highly available.\n- A grant without `stepAttemptId` covers the whole workspace; a step's\n  grant never exceeds the workspace's control-plane permission ceiling.\n- `constraints` are typed and validated by the tool's adapter.\n- A missing, expired or deleted grant denies a call. Grants are checked\n  when a call is accepted and again just before every dispatch.\n- Discovery (`get`, `list`) and invocation results enforce the caller's\n  authorization too.\n\n## Invocations\nThe service derives the tool from the subject and the workspace from the\ncaller's verified credentials, then creates the ToolInvocation itself.\nClients cannot apply one, so they cannot forge its identity or\nauthorization. The resolved tool definition is stored with it, so\nchanging the Tool cannot change accepted work. Deleting and recreating a\nTool or a ToolGrant under the same name gives it a new `uid`; nothing\ncarries over through name reuse.\n\nEvents carry references and a status summary. Results are read only\nthrough `oe.v1.toolinvocations.get`, which checks the reader may see them.\n\n## Identity\nThe acting identity comes from the authenticated NATS connection (or a\nverified delegation), never from a payload field.\n","license":{"name":"Apache-2.0"}},"defaultContentType":"application/json","servers":{"local":{"host":"localhost:4222","protocol":"nats","description":"The NATS server `oe up` starts."}},"channels":{"toolsApply":{"address":"oe.v1.tools.apply","title":"Apply a tool","messages":{"ApplyToolCommand":{"$ref":"#/components/messages/ApplyToolCommand"}}},"toolsDelete":{"address":"oe.v1.tools.delete","title":"Delete a tool","messages":{"DeleteToolCommand":{"$ref":"#/components/messages/DeleteToolCommand"}}},"toolInvoke":{"address":"oe.v1.tools.invoke.{namespace}.{name}","title":"Invoke a tool","parameters":{"namespace":{"$ref":"#/components/parameters/namespace"},"name":{"$ref":"#/components/parameters/name"}},"messages":{"InvokeToolCommand":{"$ref":"#/components/messages/InvokeToolCommand"}}},"toolGrantsApply":{"address":"oe.v1.toolgrants.apply","title":"Apply a tool grant","messages":{"A he subject's last resource ID end it: the whole name (`…{job_id}.job.created`) or its fact (`…{invocation_id}.blocked-auth`).","type":"string","pattern":"^[a-z][a-z_-]*(\\.[a-z][a-z_-]*)+$"},"occurred_at":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"},"producer":{"$ref":"#/x-schemas/common.v1.types/$defs/producer"},"causal_path":{"$ref":"#/x-schemas/common.v1.types/$defs/causal_path"},"resources":{"$ref":"#/x-schemas/common.v1.types/$defs/resource_refs"},"resource_version":{"$ref":"#/x-schemas/common.v1.types/$defs/resource_version"},"payload":{"type":"object"}},"$defs":{"operation_ref":{"description":"The command and operation an event completes or reports on. Present in completion events whose cause is a command.","type":"object","required":["operation_id","command_id"],"additionalProperties":false,"properties":{"operation_id":{"$ref":"#/x-schemas/common.v1.types/$defs/operation_id"},"command_id":{"$ref":"#/x-schemas/common.v1.types/$defs/command_id"}}},"headers":{"description":"NATS headers sent with every event, with the trace context of the work that published it.","allOf":[{"$ref":"#/x-schemas/common.v1.types/$defs/trace_headers"}],"type":"object","required":["Nats-Msg-Id"],"properties":{"Nats-Msg-Id":{"$ref":"#/x-schemas/common.v1.types/$defs/event_id"}}}}},"common.v1.meta":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Common","description":"Fields every OpenEngine resource shares. Resources follow Kubernetes conventions: `apiVersion` and `kind` say what a document is, `metadata` identifies it, `spec` holds what its author wants, and `status`, where a kind has one, is what the service observed. Applying a resource creates it under a new name and updates it under a known one; `status` and the service-set `metadata` fields are ignored on apply. Several resources may share one file, separated by `---`.","$defs":{"api_version":{"description":"The API group and version of every resource kind. The version follows the subject namespace: `v1alpha1` while `oe.v1` is a draft.","type":"string","const":"openengine.cc/v1alpha1"},"name":{"$ref":"#/x-schemas/common.v1.types/$defs/slug"},"dns_label":{"description":"A name that is also one NATS subject token: lower-case letters, digits and `-`, starting and ending with a letter or digit, at most 63 characters. No `.`, `_` or wildcards.","type":"string","pattern":"^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"},"tool_ref":{"description":"A Tool as `namespace.name`, such as `default.github-issue-comment`: two DNS labels joined by `.`.","type":"string","pattern":"^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"},"identifier":{"description":"A name that expressions refer to, such as `outputs.pick.issue`: a lower-case letter, then lower-case letters, digits and `_`. `-` is not allowed because `${outputs.a-b}` would read as a subtraction.","type":"string","pattern":"^[a-z][a-z0-9_]{0,62}$"},"description":{"description":"Plain-language description, at most 2000 characters.","type":"string","minLength":1,"maxLength":2000},"template":{"description":"Text that may contain `${...}` expressions, filled in when the step runs. Expressions read `inputs.NAME`, `outputs.STEP[.FIELD]`, `visits.STEP`, `item` inside a faceted step, literals, comparisons, `&&`, `||`, `!`, `size(...)` and `json(...)`.","type":"string"},"expression":{"description":"A bare expression, without `${...}`, in the same language as templates.","type":"string","minLength":1},"duration":{"description":"A duration of whole units, largest first, such as `90s`, `15m`, `1h30m` or `7d` (`s`, `m`, `h`, `d`).","type":"string","pattern":"^(\\d+d)?(\\d+h)?(\\d+m)?(\\d+s)?$","minLength":2},"label_key":{"description":"An optional DNS-subdomain prefix and `/`, then a name of at most 63 characters, such as `team` or `openengine.cc/owner`.","type":"string","pattern":"^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$","maxLength":317},"labels":{"description":"Short values for selecting and grouping resources, such as `team: platform`. Values are at most 63 characters of letters, digits, `-`, `_` and `.`, starting and ending alphanumeric, or empty.","type":"object","maxProperties":64,"propertyNames":{"$ref":"#/x-schemas/common.v1.meta/$defs/label_key"},"additionalProperties":{"type":"string","pattern":"^([A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?)?$"}},"annotations":{"description":"Free-form notes for tools and people. Services never act on them.","type":"object","maxProperties":64,"propertyNames":{"$ref":"#/x-schemas/common.v1.meta/$defs/label_key"},"additionalProperties":{"type":"string","maxLength":4096}},"uid":{"description":"Set by the service when the resource is created, and never reused. Deleting a resource and creating another under the same name gives a new `uid`, so nothing granted to the old one carries over.","type":"string","pattern":"^[a-z0-9][-a-z0-9]{0,62}$"},"object_meta":{"title":"ObjectMeta","description":"Identifies a resource that is not namespaced (Graph, Loop, Connection). The service sets everything else about it, such as its revision and timestamps.","type":"object","required":["name"],"additionalProperties":false,"properties":{"name":{"$ref":"#/x-schemas/common.v1.meta/$defs/name"},"labels":{"$ref":"#/x-schemas/common.v1.meta/$defs/labels"},"annotations":{"$ref":"#/x-schemas/common.v1.meta/$defs/annotations"}}},"namespaced_object_meta":{"title":"NamespacedObjectMeta","description":"Identifies a namespaced resource. `namespace` and `name` each fit in one NATS subject token. A namespace groups resources; it does not by itself isolate tenants.","type":"object","required":["name","namespace"],"additionalProperties":false,"properties":{"name":{"$ref":"#/x-schemas/common.v1.meta/$defs/dns_label"},"namespace":{"$ref":"#/x-schemas/common.v1.meta/$defs/dns_label"},"labels":{"$ref":"#/x-schemas/common.v1.meta/$defs/labels"},"annotations":{"$ref":"#/x-schemas/common.v1.meta/$defs/annotations"},"uid":{"$ref":"#/x-schemas/common.v1.meta/$defs/uid"},"generation":{"description":"Set by the service; incremented by every change to `spec`. Ignored on apply.","type":"integer","minimum":1},"creationTimestamp":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"}}}}},"common.v1.pagination":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Pagination","description":"Keyset pagination for list queries. A list query's `params` include `limit` and `cursor`; its `result` holds `items` and `next_cursor`. Each list documents its sort order, always ending in the resource ID as a tie-breaker. A cursor is opaque, bound to the filters it was issued with (reusing it with different filters is INVALID_CURSOR) and valid for at least 24 hours. Records that change between pages are neither repeated nor skipped unless their sort key or filter membership changed; records created after the first page appear only if they sort after the cursor.","$defs":{"limit":{"description":"Page size. Defaults to 50; at most 200.","type":"integer","minimum":1,"maximum":200,"default":50},"cursor":{"description":"`next_cursor` from the previous page; omitted or null for the first page.","type":["string","null"],"minLength":1,"maxLength":1024},"next_cursor":{"description":"Cursor for the next page, or null when this is the last page.","type":["string","null"],"minLength":1,"maxLength":1024}}},"common.v1.query":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Query envelope","description":"Request body of every query subject (`oe.v1.{service}.query.…`), sent with NATS request/reply. Queries have no side effects and create no operation. Service schemas narrow `params` with `allOf`.","type":"object","required":["params"],"additionalProperties":false,"properties":{"request_id":{"$ref":"#/x-schemas/common.v1.types/$defs/request_id"},"params":{"type":"object","description":"Typed filters, selectors and pagination. `{}` when the query takes none."}},"$defs":{"headers":{"$ref":"#/x-schemas/common.v1.types/$defs/trace_headers"}}},"common.v1.query-response":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Query response","description":"Reply to a query. `request_id` is echoed when the request supplied one. Service schemas narrow `result` with `allOf`.","type":"object","required":["status"],"additionalProperties":false,"properties":{"request_id":{"$ref":"#/x-schemas/common.v1.types/$defs/request_id"},"status":{"type":"string","enum":["ok","error"]},"result":{"type":"object"},"error":{"$ref":"#/x-schemas/common.v1.error"}},"allOf":[{"if":{"properties":{"status":{"const":"ok"}}},"then":{"required":["result"],"not":{"required":["error"]}}},{"if":{"properties":{"status":{"const":"error"}}},"then":{"required":["error"],"not":{"required":["result"]}}}]},"common.v1.types":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Shared primitive types","description":"Identifiers, causal paths, timestamps and versions shared by every OpenEngine V2 contract. Every identifier is a single NATS subject token: it never contains '.', '*', '>' or whitespace, so it can be placed in a subject without escaping. Resource identifiers carry a type prefix so an identifier placed in the wrong slot is rejected.","$defs":{"token":{"description":"A single NATS subject token: ASCII letters, digits, '_' and '-', starting with a letter or digit, at most 128 characters.","type":"string","pattern":"^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"},"command_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"},"event_id":{"description":"Stable identity of an event, reused unchanged when the event is republished. Also sent as the `Nats-Msg-Id` header so the stream deduplicates republication.","type":"string","pattern":"^evt_[A-Za-z0-9_-]{1,124}$"},"request_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"},"causal_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"},"causal_path":{"description":"Primary causal ancestry, root first, ending with the ID of the message that carries it. At most 32 elements, no repeats. A message whose path would exceed 32 elements is not sent and its operation fails with CAUSAL_PATH_TOO_LONG; paths are never truncated.","type":"array","minItems":1,"maxItems":32,"uniqueItems":true,"items":{"$ref":"#/x-schemas/common.v1.types/$defs/causal_id"}},"utc_timestamp":{"description":"RFC 3339 timestamp in UTC, written with a trailing 'Z'.","type":"string","format":"date-time","pattern":"^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,9})?Z$"},"resource_version":{"description":"Monotonic version of a resource, starting at 1 and incremented by every accepted change.","type":"integer","minimum":1},"slug":{"description":"Lower-case machine name, such as a provider or agent name.","type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"producer":{"description":"Logical service that emitted a message.","type":"string","enum":["cxn","ge","vcp","tools"]},"resource_name":{"description":"A namespace or the name of a namespaced resource, such as a Tool or a ToolInvocation: lower-case letters, digits and `-`, starting and ending with a letter or digit, at most 63 characters. It has no type prefix; the subject's position says what it names.","type":"string","pattern":"^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"},"operation_id":{"type":"string","pattern":"^op_[A-Za-z0-9_-]{1,125}$"},"connection_id":{"type":"string","pattern":"^conn_[A-Za-z0-9_-]{1,123}$"},"graph_id":{"type":"string","pattern":"^graph_[A-Za-z0-9_-]{1,122}$"},"job_id":{"type":"string","pattern":"^job_[A-Za-z0-9_-]{1,124}$"},"execution_id":{"description":"A graph execution: one run of a graph revision within a job.","type":"string","pattern":"^exec_[A-Za-z0-9_-]{1,123}$"},"step_instance_id":{"description":"One entry into a graph node within a graph execution.","type":"string","pattern":"^stepi_[A-Za-z0-9_-]{1,122}$"},"step_attempt_id":{"description":"One try at a step instance. A retried step has several attempts.","type":"string","pattern":"^stepa_[A-Za-z0-9_-]{1,122}$"},"workflow_approval_id":{"description":"A GE-owned approval gate in a graph execution.","type":"string","pattern":"^wfappr_[A-Za-z0-9_-]{1,121}$"},"loop_id":{"type":"string","pattern":"^loop_[A-Za-z0-9_-]{1,123}$"},"workspace_id":{"description":"Stable workspace identity. Survives suspension, restoration and runtime replacement.","type":"string","pattern":"^ws_[A-Za-z0-9_-]{1,125}$"},"runtime_id":{"description":"One provisioned compute runtime backing a workspace. Restoration after suspension creates a new runtime.","type":"string","pattern":"^rt_[A-Za-z0-9_-]{1,125}$"},"runtime_generation":{"description":"Counter incremented every time a workspace receives a new runtime. Runtime approvals and sessions are bound to the generation that created them.","type":"integer","minimum":1},"session_id":{"description":"An agent conversation inside a workspace. A session can span several task attempts.","type":"string","pattern":"^session_[A-Za-z0-9_-]{1,120}$"},"attempt_id":{"description":"One task attempt started by `execute`: the unit VCP cancels.","type":"string","pattern":"^attempt_[A-Za-z0-9_-]{1,120}$"},"runtime_approval_id":{"description":"A VCP-owned approval raised by an agent runtime inside a workspace.","type":"string","pattern":"^rtappr_[A-Za-z0-9_-]{1,121}$"},"artifact_id":{"type":"string","pattern":"^artifact_[A-Za-z0-9_-]{1,119}$"},"message_id":{"description":"A conversation message within a session.","type":"string","pattern":"^msg_[A-Za-z0-9_-]{1,124}$"},"resource_refs":{"description":"Typed references to the resources a message concerns, keyed by identifier name. Service schemas narrow this to the exact keys each message requires.","type":"object","propertyNames":{"pattern":"^[a-z][a-z_]*_id$"},"additionalProperties":{"$ref":"#/x-schemas/common.v1.types/$defs/token"}},"traceparent":{"description":"W3C Trace Context `traceparent` header (`{version}-{trace-id}-{parent-id}-{trace-flags}`), lower-case hex. Names the span that sent the message, so the receiver's work joins the sender's trace.","type":"string","pattern":"^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"},"tracestate":{"description":"W3C Trace Context `tracestate` header: vendor-specific trace data carried alongside `traceparent`, passed on unchanged.","type":"string","maxLength":512},"trace_headers":{"description":"Optional W3C Trace Context headers. Every request and event may carry them; a receiver that gets none starts a new trace.","type":"object","properties":{"traceparent":{"$ref":"#/x-schemas/common.v1.types/$defs/traceparent"},"tracestate":{"$ref":"#/x-schemas/common.v1.types/$defs/tracestate"}}}}},"tool_service.v1.resources.tool":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Tool","description":"An invocable capability bound to one Connection. Agents call it on `oe.v1.tools.invoke.{namespace}.{name}`; the connection, the adapter operation and the trusted `configuration` are fixed here, so nothing an agent sends can choose another connection or override them. Applying validates the definition with its adapter and rejects a configuration the adapter cannot honour, including a `recovery` it does not implement. Calling a tool also needs a `ToolGrant`.","type":"object","required":["apiVersion","kind","metadata","spec"],"additionalProperties":false,"properties":{"apiVersion":{"$ref":"#/x-schemas/common.v1.meta/$defs/api_version"},"kind":{"type":"string","const":"Tool"},"metadata":{"$ref":"#/x-schemas/common.v1.meta/$defs/namespaced_object_meta"},"spec":{"$ref":"#/x-schemas/tool_service.v1.resources.tool/$defs/tool_spec"},"status":{"$ref":"#/x-schemas/tool_service.v1.resources.tool/$defs/tool_status"}},"$defs":{"tool_spec":{"title":"ToolSpec","description":"What the tool does, through which connection and adapter, and how it runs.","type":"object","required":["description","connectionRef","executor","inputSchema"],"additionalProperties":false,"properties":{"description":{"description":"What the tool does and when to use it, as the agent reads it.","type":"string","minLength":1,"maxLength":4000},"connectionRef":{"$ref":"#/x-schemas/tool_service.v1.resources.tool/$defs/connection_ref"},"executor":{"$ref":"#/x-schemas/tool_service.v1.resources.tool/$defs/executor"},"inputSchema":{"$ref":"#/x-schemas/tool_service.v1.resources.tool/$defs/object_schema"},"outputSchema":{"$ref":"#/x-schemas/tool_service.v1.resources.tool/$defs/object_schema"},"configuration":{"description":"Trusted settings for the adapter, such as `repository`, validated by the adapter when the tool is applied. Arguments can never override them.","type":"object","maxProperties":64,"default":{}},"execution":{"$ref":"#/x-schemas/tool_service.v1.resources.tool/$defs/execution"}}},"connection_ref":{"title":"ConnectionRef","description":"The Connection the tool acts through. Connections are not namespaced.","type":"object","required":["name"],"additionalProperties":false,"properties":{"name":{"$ref":"#/x-schemas/common.v1.meta/$defs/name"}}},"executor":{"title":"Executor","description":"Which adapter runs the tool, and which of its operations.","type":"object","required":["adapter","operation"],"additionalProperties":false,"properties":{"adapter":{"$ref":"#/x-schemas/common.v1.types/$defs/slug"},"operation":{"description":"The adapter's operation, such as `github-issue-comment`.","type":"string","minLength":1,"maxLength":128}}},"object_schema":{"title":"ObjectSchema","description":"A JSON Schema (draft-07) whose `type` is `object`.","type":"object","required":["type"],"properties":{"type":{"type":"string","const":"object"}}},"execution":{"title":"Execution","description":"How long an attempt may run, and what happens when one is interrupted.","type":"object","additionalProperties":false,"properties":{"timeoutSeconds":{"description":"How long one attempt may run before it is treated as interrupted.","type":"integer","minimum":1,"maximum":3600,"default":60},"recovery":{"description":"What happens after an interrupted attempt, whose external effect is unknown. `retry-safe`: repeat it, within `maxAttempts`. `provider-idempotent`: repeat it with the same provider idempotency key. `reconcile`: find out from the provider whether it took effect before retrying. `manual`: record `OutcomeUnknown` for a person to resolve. The adapter must implement the value chosen.","type":"string","enum":["retry-safe","provider-idempotent","reconcile","manual"],"default":"manual"},"maxAttempts":{"description":"The most attempts one invocation may make, the first included.","type":"integer","minimum":1,"maximum":10,"default":1}}},"tool_status":{"title":"ToolStatus","description":"Set by the service; ignored on apply.","type":"object","required":["phase","observedGeneration"],"additionalProperties":false,"properties":{"phase":{"description":"`Ready`: it can be invoked. `Unavailable`: its connection is disabled or deleted, or its adapter is missing; invocations are refused until it is Ready again.","type":"string","enum":["Ready","Unavailable"]},"observedGeneration":{"description":"The `metadata.generation` this status describes.","type":"integer","minimum":1},"message":{"description":"Why the tool is not Ready.","type":"string","maxLength":2048}}}}},"tool_service.v1.resources.toolgrant":{"$schema":"http://json-schema.org/draft-07/schema#","title":"ToolGrant","description":"Lets one workspace, or one step execution in it, call one tool. Only trusted control-plane callers may apply or delete grants. The Graph Engine is the usual one: a Graph step's `agent.tools` lists the tools it may call. Once a step attempt has its workspace, and before sending the attempt to run there, the Graph Engine applies a grant for each tool to that attempt in that workspace, and deletes them when the attempt ends. Starting a step that lists tools therefore needs the tool service to be available. A missing, expired or deleted grant denies the call, and grants are checked again just before every dispatch. A grant is bound to the tool as it was when the grant was applied: a tool deleted and created again under the same name has a new `uid`, and the old grant does not cover it.","type":"object","required":["apiVersion","kind","metadata","spec"],"additionalProperties":false,"properties":{"apiVersion":{"$ref":"#/x-schemas/common.v1.meta/$defs/api_version"},"kind":{"type":"string","const":"ToolGrant"},"metadata":{"$ref":"#/x-schemas/common.v1.meta/$defs/namespaced_object_meta"},"spec":{"$ref":"#/x-schemas/tool_service.v1.resources.toolgrant/$defs/tool_grant_spec"},"status":{"$ref":"#/x-schemas/tool_service.v1.resources.toolgrant/$defs/tool_grant_status"}},"$defs":{"tool_grant_spec":{"title":"ToolGrantSpec","description":"Who may call which tool, within what limits, until when.","type":"object","required":["subject","toolRef"],"additionalProperties":false,"properties":{"subject":{"$ref":"#/x-schemas/tool_service.v1.resources.toolgrant/$defs/grant_subject"},"toolRef":{"$ref":"#/x-schemas/tool_service.v1.resources.toolgrant/$defs/name_ref"},"constraints":{"description":"Limits on the arguments, such as `issueNumbers: [42]`. Their shape is the tool's adapter's to define; it validates them when the grant is applied and enforces them on every call.","type":"object","maxProperties":64,"default":{}},"expiresAt":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"}}},"grant_subject":{"title":"GrantSubject","description":"The caller the grant covers. Without `stepAttemptId` it covers the whole workspace. A step's grant can never exceed what the control plane allows its workspace.","type":"object","required":["workspaceRef"],"additionalProperties":false,"properties":{"workspaceRef":{"$ref":"#/x-schemas/tool_service.v1.resources.toolgrant/$defs/name_ref"},"stepAttemptId":{"$ref":"#/x-schemas/common.v1.types/$defs/step_attempt_id"}}},"name_ref":{"title":"NameRef","description":"Refers to another resource by name.","type":"object","required":["name"],"additionalProperties":false,"properties":{"name":{"$ref":"#/x-schemas/common.v1.meta/$defs/dns_label"}}},"tool_grant_status":{"title":"ToolGrantStatus","description":"Set by the service; ignored on apply.","type":"object","required":["phase"],"additionalProperties":false,"properties":{"phase":{"description":"`Active`: it allows calls. `Expired`: `expiresAt` has passed.","type":"string","enum":["Active","Expired"]},"toolUid":{"$ref":"#/x-schemas/common.v1.meta/$defs/uid"}}}}},"tool_service.v1.resources.toolinvocation":{"$schema":"http://json-schema.org/draft-07/schema#","title":"ToolInvocation","description":"The durable record of one tool call. The service creates it when a call on `oe.v1.tools.invoke.{namespace}.{name}` is accepted, and owns its status; it cannot be applied, so nobody can forge its identity or authorization. The tool comes from the subject and the workspace from the caller's verified credentials. The resolved tool definition is stored with it, so changing the Tool later cannot change accepted work. Its result is read through `oe.v1.toolinvocations.get`, never from events.","type":"object","required":["apiVersion","kind","metadata","spec"],"additionalProperties":false,"properties":{"apiVersion":{"$ref":"#/x-schemas/common.v1.meta/$defs/api_version"},"kind":{"type":"string","const":"ToolInvocation"},"metadata":{"$ref":"#/x-schemas/common.v1.meta/$defs/namespaced_object_meta"},"spec":{"$ref":"#/x-schemas/tool_service.v1.resources.toolinvocation/$defs/tool_invocation_spec"},"status":{"$ref":"#/x-schemas/tool_service.v1.resources.toolinvocation/$defs/tool_invocation_status"}},"$defs":{"tool_invocation_spec":{"title":"ToolInvocationSpec","description":"What was called, by whom, with what.","type":"object","required":["toolRef","workspaceRef","workspaceGeneration","stepAttemptId","arguments"],"additionalProperties":false,"properties":{"toolRef":{"$ref":"#/x-schemas/tool_service.v1.resources.toolinvocation/$defs/tool_ref"},"workspaceRef":{"$ref":"#/x-schemas/tool_service.v1.resources.toolgrant/$defs/nam
