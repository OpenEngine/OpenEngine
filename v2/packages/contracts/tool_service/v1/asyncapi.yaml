      examples:
        - name: tools.get.query
          payload: { $ref: './examples/tools.get.query.json#/payload' }
    GetToolResponse:
      name: GetToolResponse
      title: Get a tool response
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: './schemas/queries.schema.json#/$defs/get_tool_response' }
      examples:
        - name: ok
          payload: { $ref: './examples/tools.get.response.json#/payload' }
    ListToolsQuery:
      name: ListToolsQuery
      title: List tools query
      traits: [{ $ref: '#/components/messageTraits/queryHeaders' }]
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: './schemas/queries.schema.json#/$defs/list_tools_query' }
      examples:
        - name: tools.list.query
          payload: { $ref: './examples/tools.list.query.json#/payload' }
    ListToolsResponse:
      name: ListToolsResponse
      title: List tools response
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: './schemas/queries.schema.json#/$defs/list_tools_response' }
      examples:
        - name: ok
          payload: { $ref: './examples/tools.list.response.json#/payload' }
    GetToolGrantQuery:
      name: GetToolGrantQuery
      title: Get a tool grant query
      traits: [{ $ref: '#/components/messageTraits/queryHeaders' }]
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: './schemas/queries.schema.json#/$defs/get_tool_grant_query' }
      examples:
        - name: toolgrants.get.query
          payload: { $ref: './examples/toolgrants.get.query.json#/payload' }
    GetToolGrantResponse:
      name: GetToolGrantResponse
      title: Get a tool grant response
      payload:
        schemaFormat: application/schema+json;version=draft-07
