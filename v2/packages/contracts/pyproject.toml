[project]
name = "openengine-contracts"
version = "0.0.0"
description = "OpenEngine V2's service contracts and resource schemas, and the validator that checks messages and resources against them."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openengine"]

# A wheel carries the contract files inside the package; an editable install reads them from the source tree.
[tool.hatch.build.targets.wheel.force-include]
"common" = "openengine/contracts/common"
"connection_bus" = "openengine/contracts/connection_bus"
"graph_engine" = "openengine/contracts/graph_engine"
"tool_service" = "openengine/contracts/tool_service"
"virtual_control_plane" = "openengine/contracts/virtual_control_plane"
