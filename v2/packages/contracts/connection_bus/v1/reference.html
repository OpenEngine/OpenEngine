d.\n\n## Subject tokens\nEvery `{…_id}` parameter is a single subject token of the form its\nprefix names (`conn_…`). A malformed token is answered with\n`INVALID_ARGUMENT` naming `subject.{parameter}`.\n\n## In-flight work\n- **disable** stops new ingress and egress. Deliveries already accepted\n  are drained (`in_flight: drain`, default) or held until the connection\n  is re-enabled (`hold`). Held work that cannot be retained is failed\n  explicitly; nothing accepted is dropped silently.\n- **delete** is refused with `INVALID_STATE` while accepted deliveries\n  remain (`in_flight: reject`, default), or fails each of them explicitly\n  and reports the count (`fail`). Historical job and audit records are\n  kept and the connection ID is never reused.\n\n## Out of scope\nMapping, reconciliation, binding resolution, delivery queries, operation\nqueries, and provider ingress/egress payloads (`cxn.ingress.>`,\n`cxn.egress.>`) are not part of this contract.\n","license":{"name":"Apache-2.0"}},"defaultContentType":"application/json","servers":{"local":{"host":"localhost:4222","protocol":"nats","description":"The NATS server `oe up` starts."}},"channels":{"connectionsAdd":{"address":"oe.v1.cxn.control.connections.add","title":"Add a connection","messages":{"AddConnectionCommand":{"$ref":"#/components/messages/AddConnectionCommand"}}},"connectionConfigure":{"address":"oe.v1.cxn.control.connections.{connection_id}.configure","title":"Configure a connection","parameters":{"connection_id":{"$ref":"#/components/parameters/connection_id"}},"messages":{"ConfigureConnectionCommand":{"$ref":"#/components/messages/ConfigureConnectionCommand"}}},"connectionDisable":{"address":"oe.v1.cxn.control.connections.{connection_id}.disable","title":"Disable a connection","parameters":{"connection_id":{"$ref":"#/components/parameters/connection_id"}},"messages":{"DisableConnectionCommand":{"$ref":"#/components/messages/DisableConnectionCommand"}}},"connectionDelete":{"address":"oe.v1.cxn.contro perties":{"code":{"const":"COMMAND_ID_CONFLICT"}}},"then":{"required":["details"],"properties":{"retryable":{"const":false},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/command_id_conflict_details"}}}},{"if":{"properties":{"code":{"const":"UNSUPPORTED_CAPABILITY"}}},"then":{"required":["details"],"properties":{"retryable":{"const":false},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/unsupported_capability_details"}}}},{"if":{"properties":{"code":{"const":"DEADLINE_EXCEEDED"}}},"then":{"required":["details"],"properties":{"retryable":{"const":false},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/deadline_exceeded_details"}}}},{"if":{"properties":{"code":{"const":"UNAVAILABLE"}}},"then":{"properties":{"retryable":{"const":true},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/unavailable_details"}}}},{"if":{"properties":{"code":{"const":"CAUSAL_PATH_TOO_LONG"}}},"then":{"required":["details"],"properties":{"retryable":{"const":false},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/causal_path_too_long_details"}}}},{"if":{"properties":{"code":{"const":"STALE_APPROVAL"}}},"then":{"required":["details"],"properties":{"retryable":{"const":false},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/stale_approval_details"}}}},{"if":{"properties":{"code":{"const":"INVALID_CURSOR"}}},"then":{"properties":{"retryable":{"const":false},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/invalid_cursor_details"}}}}],"$defs":{"code":{"type":"string","enum":["INVALID_ARGUMENT","NOT_FOUND","PERMISSION_DENIED","INVALID_STATE","VERSION_CONFLICT","COMMAND_ID_CONFLICT","UNSUPPORTED_CAPABILITY","DEADLINE_EXCEEDED","UNAVAILABLE","CAUSAL_PATH_TOO_LONG","STALE_APPROVAL","INVALID_CURSOR","PROVIDER_ERROR","INTERNAL"],"description":"INVALID_ARGUMENT: the message, a subject token, or a subject/payload pairing is malformed. NOT_FOUND: a named resource does not exist or is not visible. PERMISSION_DENIED: the verified actor may not perform the action. INVALID_STATE: efs/operation_id"},"command_id":{"$ref":"#/x-schemas/common.v1.types/$defs/command_id"}}},"headers":{"description":"NATS headers sent with every event.","type":"object","required":["Nats-Msg-Id"],"properties":{"Nats-Msg-Id":{"$ref":"#/x-schemas/common.v1.types/$defs/event_id"}}}}},"common.v1.pagination":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Pagination","description":"Keyset pagination for list queries. A list query's `params` include `limit` and `cursor`; its `result` holds `items` and `next_cursor`. Each list documents its sort order, always ending in the resource ID as a tie-breaker. A cursor is opaque, bound to the filters it was issued with (reusing it with different filters is INVALID_CURSOR) and valid for at least 24 hours. Records that change between pages are neither repeated nor skipped unless their sort key or filter membership changed; records created after the first page appear only if they sort after the cursor.","$defs":{"limit":{"description":"Page size. Defaults to 50; at most 200.","type":"integer","minimum":1,"maximum":200,"default":50},"cursor":{"description":"`next_cursor` from the previous page; omitted or null for the first page.","type":["string","null"],"minLength":1,"maxLength":1024},"next_cursor":{"description":"Cursor for the next page, or null when this is the last page.","type":["string","null"],"minLength":1,"maxLength":1024}}},"common.v1.query":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Query envelope","description":"Request body of every query subject (`oe.v1.{service}.query.…`), sent with NATS request/reply. Queries have no side effects and create no operation. Service schemas narrow `params` with `allOf`.","type":"object","required":["params"],"additionalProperties":false,"properties":{"request_id":{"$ref":"#/x-schemas/common.v1.types/$defs/request_id"},"params":{"type":"object","description":"Typed filters, selectors and pagination. `{}` when the query takes none."}}},"common.v1.query-response":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Query response","description":"Reply to a query. `request_id` is echoed when the request supplied one. Service schemas narrow `result` with `allOf`.","type":"object","required":["status"],"additionalProperties":false,"properties":{"request_id":{"$ref":"#/x-schemas/common.v1.types/$defs/request_id"},"status":{"type":"string","enum":["ok","error"]},"result":{"type":"object"},"error":{"$ref":"#/x-schemas/common.v1.error"}},"allOf":[{"if":{"properties":{"status":{"const":"ok"}}},"then":{"required":["result"],"not":{"required":["error"]}}},{"if":{"properties":{"status":{"const":"error"}}},"then":{"required":["error"],"not":{"required":["result"]}}}]},"common.v1.types":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Shared primitive types","description":"Identifiers, causal paths, timestamps and versions shared by every OpenEngine V2 contract. Every identifier is a single NATS subject token: it never contains '.', '*', '>' or whitespace, so it can be placed in a subject without escaping. Resource identifiers carry a type prefix so an identifier placed in the wrong slot is rejected.","$defs":{"token":{"description":"A single NATS subject token: ASCII letters, digits, '_' and '-', starting with a letter or digit, at most 128 characters.","type":"string","pattern":"^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"},"command_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"},"event_id":{"description":"Stable identity of an event, reused unchanged when the event is republished. Also sent as the `Nats-Msg-Id` header so the stream deduplicates republication.","type":"string","pattern":"^evt_[A-Za-z0-9_-]{1,124}$"},"request_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"},"causal_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"},"causal_path":{"description":"Primary causal ancestry, root first, ending with the ID of the message that carries it. At most 32 elements, no repeats. A message whose path would exceed 32 elements is not sent and its operation fails with CAUSAL_PATH_TOO_LONG; paths are never truncated.","type":"array","minItems":1,"maxItems":32,"uniqueItems":true,"items":{"$ref":"#/x-schemas/common.v1.types/$defs/causal_id"}},"utc_timestamp":{"description":"RFC 3339 timestamp in UTC, written with a trailing 'Z'.","type":"string","format":"date-time","pattern":"^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,9})?Z$"},"resource_version":{"description":"Monotonic version of a resource, starting at 1 and incremented by every accepted change.","type":"integer","minimum":1},"slug":{"description":"Lower-case machine name, such as a provider or agent name.","type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"producer":{"description":"Logical service that emitted a message.","type":"string","enum":["cxn","ge","vcp"]},"operation_id":{"type":"string","pattern":"^op_[A-Za-z0-9_-]{1,125}$"},"connection_id":{"type":"string","pattern":"^conn_[A-Za-z0-9_-]{1,123}$"},"graph_id":{"type":"string","pattern":"^graph_[A-Za-z0-9_-]{1,122}$"},"job_id":{"type":"string","pattern":"^job_[A-Za-z0-9_-]{1,124}$"},"execution_id":{"description":"A graph execution: one run of a graph revision within a job.","type":"string","pattern":"^exec_[A-Za-z0-9_-]{1,123}$"},"step_instance_id":{"description":"One entry into a graph node within a graph execution.","type":"string","pattern":"^stepi_[A-Za-z0-9_-]{1,122}$"},"step_attempt_id":{"description":"One try at a step instance. A retried step has several attempts.","type":"string","pattern":"^stepa_[A-Za-z0-9_-]{1,122}$"},"workflow_approval_id":{"description":"A GE-owned approval gate in a graph execution.","type":"string","pattern":"^wfappr_[A-Za-z0-9_-]{1,121}$"},"loop_id":{"type":"string","pattern":"^loop_[A-Za-z0-9_-]{1,123}$"},"workspace_id":{"description":"Stable workspace identity. Survives suspension, restoration and runtime replacement.","type":"string","pattern":"^ws_[A-Za-z0-9_-]{1,125}$"},"runtime_id":{"description":"One provisioned compute runtime backing a workspace. Restoration after suspension creates a new runtime.","type":"string","pattern":"^rt_[A-Za-z0-9_-]{1,125}$"},"runtime_generation":{"description":"Counter incremented every time a workspace receives a new runtime. Runtime approvals and sessions are bound to the generation that created them.","type":"integer","minimum":1},"session_id":{"description":"An agent conversation inside a workspace. A session can span several task attempts.","type":"string","pattern":"^session_[A-Za-z0-9_-]{1,120}$"},"attempt_id":{"description":"One task attempt started by `execute`: the unit VCP cancels.","type":"string","pattern":"^attempt_[A-Za-z0-9_-]{1,120}$"},"runtime_approval_id":{"description":"A VCP-owned approval raised by an agent runtime inside a workspace.","type":"string","pattern":"^rtappr_[A-Za-z0-9_-]{1,121}$"},"artifact_id":{"type":"string","pattern":"^artifact_[A-Za-z0-9_-]{1,119}$"},"message_id":{"description":"A conversation message within a session.","type":"string","pattern":"^msg_[A-Za-z0-9_-]{1,124}$"},"resource_refs":{"description":"Typed references to the resources a message concerns, keyed by identifier name. Service schemas narrow this to the exact keys each message requires.","type":"object","propertyNames":{"pattern":"^[a-z][a-z_]*_id$"},"additionalProperties":{"$ref":"#/x-schemas/common.v1.types/$defs/token"}}}},"connection_bus.v1.schemas.commands":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Connection Bus commands","description":"Requests and responses of `oe.v1.cxn.control.…`. The connection named in the subject is the target; payloads do not repeat it.","$defs":{"add_connection_command":{"allOf":[{"$ref":"#/x-schemas/common.v1.command"},{"properties":{"payload":{"$ref":"#/x-schemas/connection_bus.v1.schemas.commands/$defs/add_connection_payload"}}}]},"add_connection_payload":{"type":"object","required":["provider","external_account","credential_ref","scope"],"additionalProperties":fa
