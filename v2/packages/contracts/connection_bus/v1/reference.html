 are not.\n\n## Identity\nThe acting identity comes from the authenticated NATS connection (or a\nverified delegation), never from a payload field.\n\n## Subject tokens\nEvery `{…_id}` parameter is a single subject token of the form its\nprefix names (`conn_…`). A malformed token is answered with\n`INVALID_ARGUMENT` naming `subject.{parameter}`.\n\n## Apply\nConnections are created and changed by applying a Connection resource\n(`kind: Connection`, `apiVersion: openengine.cc/v1alpha1`; see\n`resources/`), Kubernetes-style, keyed by its `metadata.name`: a new name\ncreates the connection and allocates its `conn_…` ID, a known one updates\nit. Tools name the connection they act through by that name.\n\n## In-flight work\n- **disable** stops new ingress and egress. Deliveries already accepted\n  are drained (`in_flight: drain`, default) or held until the connection\n  is re-enabled (`hold`). Held work that cannot be retained is failed\n  explicitly; nothing accepted is dropped silently.\n- **delete** is refused with `INVALID_STATE` while accepted deliveries\n  remain (`in_flight: reject`, default), or fails each of them explicitly\n  and reports the count (`fail`). Historical job and audit records are\n  kept and the connection ID is never reused.\n\n## Out of scope\nMapping, reconciliation, binding resolution, delivery queries, operation\nqueries, and provider ingress/egress payloads (`cxn.ingress.>`,\n`cxn.egress.>`) are not part of this contract.\n","license":{"name":"Apache-2.0"}},"defaultContentType":"application/json","servers":{"local":{"host":"localhost:4222","protocol":"nats","description":"The NATS server `oe up` starts."}},"channels":{"connectionsApply":{"address":"oe.v1.cxn.control.connections.apply","title":"Apply a connection","messages":{"ApplyConnectionCommand":{"$ref":"#/components/messages/ApplyConnectionCommand"}}},"connectionDisable":{"address":"oe.v1.cxn.control.connections.{connection_id}.disable","title":"Disable a connection","parameters":{"conn required":["operation_id"],"not":{"required":["error"]}}},{"if":{"properties":{"status":{"const":"rejected"}}},"then":{"required":["error"],"not":{"required":["operation_id"]}}}]},"common.v1.error":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Error","description":"Structured error carried by rejected command responses, failed query responses and failed operations. `code` is stable and machine-readable; `message` is for people and may change. `retryable` says whether sending the unchanged request again may succeed, and is authoritative over any default implied by the code. Consumers must treat an unknown `code` as a non-specific failure and rely on `retryable`.","type":"object","required":["code","message","retryable"],"additionalProperties":false,"properties":{"code":{"$ref":"#/x-schemas/common.v1.error/$defs/code"},"message":{"type":"string","minLength":1,"maxLength":2048},"retryable":{"type":"boolean"},"details":{"type":"object"}},"allOf":[{"if":{"properties":{"code":{"const":"INVALID_ARGUMENT"}}},"then":{"properties":{"retryable":{"const":false},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/invalid_argument_details"}}}},{"if":{"properties":{"code":{"const":"NOT_FOUND"}}},"then":{"properties":{"details":{"$ref":"#/x-schemas/common.v1.error/$defs/resource_details"}}}},{"if":{"properties":{"code":{"const":"PERMISSION_DENIED"}}},"then":{"properties":{"retryable":{"const":false},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/permission_details"}}}},{"if":{"properties":{"code":{"const":"INVALID_STATE"}}},"then":{"properties":{"details":{"$ref":"#/x-schemas/common.v1.error/$defs/invalid_state_details"}}}},{"if":{"properties":{"code":{"const":"VERSION_CONFLICT"}}},"then":{"required":["details"],"properties":{"retryable":{"const":false},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/version_conflict_details"}}}},{"if":{"properties":{"code":{"const":"COMMAND_ID_CONFLICT"}}},"then":{"required":["details"],"properties":{"retryable":{"const":false},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/command_id_conflict_details"}}}},{"if":{"properties":{"code":{"const":"UNSUPPORTED_CAPABILITY"}}},"then":{"required":["details"],"properties":{"retryable":{"const":false},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/unsupported_capability_details"}}}},{"if":{"properties":{"code":{"const":"DEADLINE_EXCEEDED"}}},"then":{"required":["details"],"properties":{"retryable":{"const":false},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/deadline_exceeded_details"}}}},{"if":{"properties":{"code":{"const":"UNAVAILABLE"}}},"then":{"properties":{"retryable":{"const":true},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/unavailable_details"}}}},{"if":{"properties":{"code":{"const":"CAUSAL_PATH_TOO_LONG"}}},"then":{"required":["details"],"properties":{"retryable":{"const":false},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/causal_path_too_long_details"}}}},{"if":{"properties":{"code":{"const":"STALE_APPROVAL"}}},"then":{"required":["details"],"properties":{"retryable":{"const":false},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/stale_approval_details"}}}},{"if":{"properties":{"code":{"const":"INVALID_CURSOR"}}},"then":{"properties":{"retryable":{"const":false},"details":{"$ref":"#/x-schemas/common.v1.error/$defs/invalid_cursor_details"}}}}],"$defs":{"code":{"type":"string","enum":["INVALID_ARGUMENT","NOT_FOUND","PERMISSION_DENIED","INVALID_STATE","VERSION_CONFLICT","COMMAND_ID_CONFLICT","UNSUPPORTED_CAPABILITY","DEADLINE_EXCEEDED","UNAVAILABLE","CAUSAL_PATH_TOO_LONG","STALE_APPROVAL","INVALID_CURSOR","PROVIDER_ERROR","INTERNAL"],"description":"INVALID_ARGUMENT: the message, a subject token, or a subject/payload pairing is malformed. NOT_FOUND: a named resource does not exist or is not visible. PERMISSION_DENIED: the verified actor may not perform the action. INVALID_STATE: the resource is in a state that does not allow the action. VERSION_CONFLICT: `expected_version` did not match. COMMAND_ID_CONFLICT: the command ID was already used with different contents, operation or target. UNSUPPORTED_CAPABILITY: the provider or service does not support what was asked. DEADLINE_EXCEEDED: `deadline_at` passed before the command could be accepted. UNAVAILABLE: temporarily unable to answer; retry with the same command ID. CAUSAL_PATH_TOO_LONG: the causal path cannot be extended within its 32-element limit. STALE_APPROVAL: an approval decision targets a request that was superseded, expired, already decided, or belongs to an earlier runtime generation. INVALID_CURSOR: a page cursor is malformed, expired, or was issued for different filters. PROVIDER_ERROR: an external provider failed (operation and lifecycle failures). INTERNAL: an unexpected service fault."},"field_violation":{"type":"object","required":["field","description"],"additionalProperties":false,"properties":{"field":{"type":"string","description":"JSON pointer into the message, or `subject.{parameter}` for a subject token."},"description":{"type":"string"}}},"invalid_argument_details":{"type":"object","required":["violations"],"additionalProperties":false,"properties":{"violations":{"type":"array","minItems":1,"items":{"$ref":"#/x-schemas/common.v1.error/$defs/field_violation"}}}},"resource_details":{"type":"object","required":["resource_type","resource_id"],"additionalProperties":false,"properties":{"resource_type":{"type":"string"},"resource_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"}}},"permission_details":{"type":"object","additionalProperties":false,"properties":{"permission":{"type":"string","description":"The permission that was missing, such as `ge.jobs.cancel`."}}},"invalid_state_details":{"type":"object","required":["resource_type","resource_id","current_state"],"additionalProperties":false,"properties":{"resource_type":{"type":"string"},"resource_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"},"current_state":{"type":"string"},"allowed_states":{"type":"array","items":{"type":"string"}}}},"version_conflict_details":{"type":"object","required":["expected_version","actual_version"],"additionalProperties":false,"properties":{"expected_version":{"$ref":"#/x-schemas/common.v1.types/$defs/resource_version"},"actual_version":{"$ref":"#/x-schemas/common.v1.types/$defs/resource_version"}}},"command_id_conflict_details":{"type":"object","required":["command_id"],"additionalProperties":false,"properties":{"command_id":{"$ref":"#/x-schemas/common.v1.types/$defs/command_id"},"original_subject":{"type":"string","description":"Subject the command ID was first used on, when the caller may see it."},"original_operation_id":{"$ref":"#/x-schemas/common.v1.types/$defs/operation_id"}}},"unsupported_capability_details":{"type":"object","required":["capability"],"additionalProperties":false,"properties":{"capability":{"type":"string"},"provider":{"$ref":"#/x-schemas/common.v1.types/$defs/slug"}}},"deadline_exceeded_details":{"type":"object","required":["deadline_at","received_at"],"additionalProperties":false,"properties":{"deadline_at":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"},"received_at":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"}}},"unavailable_details":{"type":"object","additionalProperties":false,"properties":{"retry_after_ms":{"type":"integer","minimum":0}}},"causal_path_too_long_details":{"type":"object","required":["max_length","length"],"additionalProperties":false,"properties":{"max_length":{"type":"integer"},"length":{"type":"integer","description":"Length the path would have reached."}}},"stale_approval_details":{"type":"object","required":["approval_id","reason"],"additionalProperties":false,"properties":{"approval_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"},"reason":{"type":"string","enum":["already_decided","superseded","expired","runtime_generation_changed","target_mismatch"]},"current_state":{"type":"string"},"current_runtime_generation":{"$ref":"#/x-schemas/common.v1.types/$defs/runtime_generation"}}},"invalid_cursor_details":{"type":"object","additionalProperties":false,"properties":{"reason":{"type":"string","enum":["malformed","expired","filters_changed"]}}}}},"common.v1.event":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Event envelope","description":"Body of every event published to a service's existing event stream. Events may be delivered more than once: deduplicate on `event_id`. `occurred_at` does not establish a global order; ordering is guaranteed only among events of one partition (the resource named in the subject), in publish order. The final element of `causal_path` must equal `event_id` (checked by `tooling/validate.py`). Service schemas fix `event_type` and `producer` and narrow `resources` and `payload` with `allOf`.","type":"object","required":["event_id","event_type","occurred_at","producer","causal_path","resources","payload"],"additionalProperties":false,"properties":{"event_id":{"$ref":"#/x-schemas/common.v1.types/$defs/event_id"},"event_type":{"description":"Dotted `{family}.{fact}` name; the schema discriminator. The tokens after the subject's last resource ID end it: the whole name (`…{job_id}.job.created`) or its fact (`…{invocation_id}.blocked-auth`).","type":"string","pattern":"^[a-z][a-z_-]*(\\.[a-z][a-z_-]*)+$"},"occurred_at":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"},"producer":{"$ref":"#/x-schemas/common.v1.types/$defs/producer"},"causal_path":{"$ref":"#/x-schemas/common.v1.types/$defs/causal_path"},"resources":{"$ref":"#/x-schemas/common.v1.types/$defs/resource_refs"},"resource_version":{"$ref":"#/x-schemas/common.v1.types/$defs/resource_version"},"payload":{"type":"object"}},"$defs":{"operation_ref":{"description":"The command and operation an event completes or reports on. Present in completion events whose cause is a command.","type":"object","required":["operation_id","command_id"],"additionalProperties":false,"properties":{"operation_id":{"$ref":"#/x-schemas/common.v1.types/$defs/operation_id"},"command_id":{"$ref":"#/x-schemas/common.v1.types/$defs/command_id"}}},"headers":{"description":"NATS headers sent with every event, with the trace context of the work that published it.","allOf":[{"$ref":"#/x-schemas/common.v1.types/$defs/trace_headers"}],"type":"object","required":["Nats-Msg-Id"],"properties":{"Nats-Msg-Id":{"$ref":"#/x-schemas/common.v1.types/$defs/event_id"}}}}},"common.v1.meta":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Common","description":"Fields every OpenEngine resource shares. Resources follow Kubernetes conventions: `apiVersion` and `kind` say what a document is, `metadata` identifies it, `spec` holds what its author wants, and `status`, where a kind has one, is what the service observed. Applying a resource creates it under a new name and updates it under a known one; `status` and the service-set `metadata` fields are ignored on apply. Several resources may share one file, separated by `---`.","$defs":{"api_version":{"description":"The API group and version of every resource kind. The version follows the subject namespace: `v1alpha1` while `oe.v1` is a draft.","type":"string","const":"openengine.cc/v1alpha1"},"name":{"$ref":"#/x-schemas/common.v1.types/$defs/slug"},"dns_label":{"description":"A name that is also one NATS subject token: lower-case letters, digits and `-`, starting and ending with a letter or digit, at most 63 characters. No `.`, `_` or wildcards.","type":"string","pattern":"^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"},"tool_ref":{"description":"A Tool as `namespace.name`, such as `default.github-issue-comment`: two DNS labels joined by `.`.","type":"string","pattern":"^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"},"identifier":{"description":"A name that expressions refer to, such as `outputs.pick.issue`: a lower-case letter, then lower-case letters, digits and `_`. `-` is not allowed because `${outputs.a-b}` would read as a subtraction.","type":"string","pattern":"^[a-z][a-z0-9_]{0,62}$"},"description":{"description":"Plain-language description, at most 2000 characters.","type":"string","minLength":1,"maxLength":2000},"template":{"description":"Text that may contain `${...}` expressions, filled in when the step runs. Expressions read `inputs.NAME`, `outputs.STEP[.FIELD]`, `visits.STEP`, `item` inside a faceted step, literals, comparisons, `&&`, `||`, `!`, `size(...)` and `json(...)`.","type":"string"},"expression":{"description":"A bare expression, without `${...}`, in the same language as templates.","type":"string","minLength":1},"duration":{"description":"A duration of whole units, largest first, such as `90s`, `15m`, `1h30m` or `7d` (`s`, `m`, `h`, `d`).","type":"string","pattern":"^(\\d+d)?(\\d+h)?(\\d+m)?(\\d+s)?$","minLength":2},"label_key":{"description":"An optional DNS-subdomain prefix and `/`, then a name of at most 63 characters, such as `team` or `openengine.cc/owner`.","type":"string","pattern":"^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$","maxLength":317},"labels":{"description":"Short values for selecting and grouping resources, such as `team: platform`. Values are at most 63 characters of letters, digits, `-`, `_` and `.`, starting and ending alphanumeric, or empty.","type":"object","maxProperties":64,"propertyNames":{"$ref":"#/x-schemas/common.v1.meta/$defs/label_key"},"additionalProperties":{"type":"string","pattern":"^([A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?)?$"}},"annotations":{"description":"Free-form notes for tools and people. Services never act on them.","type":"object","maxProperties":64,"propertyNames":{"$ref":"#/x-schemas/common.v1.meta/$defs/label_key"},"additionalProperties":{"type":"string","maxLength":4096}},"uid":{"description":"Set by the service when the resource is created, and never reused. Deleting a resource and creating another under the same name gives a new `uid`, so nothing granted to the old one carries over.","type":"string","pattern":"^[a-z0-9][-a-z0-9]{0,62}$"},"object_meta":{"title":"ObjectMeta","description":"Identifies a resource that is not namespaced (Graph, Loop, Connection). The service sets everything else about it, such as its revision and timestamps.","type":"object","required":["name"],"additionalProperties":false,"properties":{"name":{"$ref":"#/x-schemas/common.v1.meta/$defs/name"},"labels":{"$ref":"#/x-schemas/common.v1.meta/$defs/labels"},"annotations":{"$ref":"#/x-schemas/common.v1.meta/$defs/annotations"}}},"namespaced_object_meta":{"title":"NamespacedObjectMeta","description":"Identifies a namespaced resource. `namespace` and `name` each fit in one NATS subject token. A namespace groups resources; it does not by itself isolate tenants.","type":"object","required":["name","namespace"],"additionalProperties":false,"properties":{"name":{"$ref":"#/x-schemas/common.v1.meta/$defs/dns_label"},"namespace":{"$ref":"#/x-schemas/common.v1.meta/$defs/dns_label"},"labels":{"$ref":"#/x-schemas/common.v1.meta/$defs/labels"},"annotations":{"$ref":"#/x-schemas/common.v1.meta/$defs/annotations"},"uid":{"$ref":"#/x-schemas/common.v1.meta/$defs/uid"},"generation":{"description":"Set by the service; incremented by every change to `spec`. Ignored on apply.","type":"integer","minimum":1},"creationTimestamp":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"}}}}},"common.v1.pagination":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Pagination","description":"Keyset pagination for list queries. A list query's `params` include `limit` and `cursor`; its `result` holds `items` and `next_cursor`. Each list documents its sort order, always ending in the resource ID as a tie-breaker. A cursor is opaque, bound to the filters it was issued with (reusing it with different filters is INVALID_CURSOR) and valid for at least 24 hours. Records that change between pages are neither repeated nor skipped unless their sort key or filter membership changed; records created after the first page appear only if they sort after the cursor.","$defs":{"limit":{"description":"Page size. Defaults to 50; at most 200.","type":"integer","minimum":1,"maximum":200,"default":50},"cursor":{"description":"`next_cursor` from the previous page; omitted or null for the first page.","type":["string","null"],"minLength":1,"maxLength":1024},"next_cursor":{"description":"Cursor for the next page, or null when this is the last page.","type":["string","null"],"minLength":1,"maxLength":1024}}},"common.v1.query":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Query envelope","description":"Request body of every query subject (`oe.v1.{service}.query.…`), sent with NATS request/reply. Queries have no side effects and create no operation. Service schemas narrow `params` with `allOf`.","type":"object","required":["params"],"additionalProperties":false,"properties":{"request_id":{"$ref":"#/x-schemas/common.v1.types/$defs/request_id"},"params":{"type":"object","description":"Typed filters, selectors and pagination. `{}` when the query takes none."}},"$defs":{"headers":{"$ref":"#/x-schemas/common.v1.types/$defs/trace_headers"}}},"common.v1.query-response":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Query response","description":"Reply to a query. `request_id` is echoed when the request supplied one. Service schemas narrow `result` with `allOf`.","type":"object","required":["status"],"additionalProperties":false,"properties":{"request_id":{"$ref":"#/x-schemas/common.v1.types/$defs/request_id"},"status":{"type":"string","enum":["ok","error"]},"result":{"type":"object"},"error":{"$ref":"#/x-schemas/common.v1.error"}},"allOf":[{"if":{"properties":{"status":{"const":"ok"}}},"then":{"required":["result"],"not":{"required":["error"]}}},{"if":{"properties":{"status":{"const":"error"}}},"then":{"required":["error"],"not":{"required":["result"]}}}]},"common.v1.types":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Shared primitive types","description":"Identifiers, causal paths, timestamps and versions shared by every OpenEngine V2 contract. Every identifier is a single NATS subject token: it never contains '.', '*', '>' or whitespace, so it can be placed in a subject without escaping. Resource identifiers carry a type prefix so an identifier placed in the wrong slot is rejected.","$defs":{"token":{"description":"A single NATS subject token: ASCII letters, digits, '_' and '-', starting with a letter or digit, at most 128 characters.","type":"string","pattern":"^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"},"command_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"},"event_id":{"description":"Stable identity of an event, reused unchanged when the event is republished. Also sent as the `Nats-Msg-Id` header so the stream deduplicates republication.","type":"string","pattern":"^evt_[A-Za-z0-9_-]{1,124}$"},"request_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"},"causal_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"},"causal_path":{"description":"Primary causal ancestry, root first, ending with the ID of the message that carries it. At most 32 elements, no repeats. A message whose path would exceed 32 elements is not sent and its operation fails with CAUSAL_PATH_TOO_LONG; paths are never truncated.","type":"array","minItems":1,"maxItems":32,"uniqueItems":true,"items":{"$ref":"#/x-schemas/common.v1.types/$defs/causal_id"}},"utc_timestamp":{"description":"RFC 3339 timestamp in UTC, written with a trailing 'Z'.","type":"string","format":"date-time","pattern":"^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,9})?Z$"},"resource_version":{"description":"Monotonic version of a resource, starting at 1 and incremented by every accepted change.","type":"integer","minimum":1},"slug":{"description":"Lower-case machine name, such as a provider or agent name.","type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"producer":{"description":"Logical service that emitted a message.","type":"string","enum":["cxn","ge","vcp","tools"]},"resource_name":{"description":"A namespace or the name of a namespaced resource, such as a Tool or a ToolInvocation: lower-case letters, digits and `-`, starting and ending with a letter or digit, at most 63 characters. It has no type prefix; the subject's position says what it names.","type":"string","pattern":"^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"},"operation_id":{"type":"string","pattern":"^op_[A-Za-z0-9_-]{1,125}$"},"connection_id":{"type":"string","pattern":"^conn_[A-Za-z0-9_-]{1,123}$"},"graph_id":{"type":"string","pattern":"^graph_[A-Za-z0-9_-]{1,122}$"},"job_id":{"type":"string","pattern":"^job_[A-Za-z0-9_-]{1,124}$"},"execution_id":{"description":"A graph execution: one run of a graph revision within a job.","type":"string","pattern":"^exec_[A-Za-z0-9_-]{1,123}$"},"step_instance_id":{"description":"One entry into a graph node within a graph execution.","type":"string","pattern":"^stepi_[A-Za-z0-9_-]{1,122}$"},"step_attempt_id":{"description":"One try at a step instance. A retried step has several attempts.","type":"string","pattern":"^stepa_[A-Za-z0-9_-]{1,122}$"},"workflow_approval_id":{"description":"A GE-owned approval gate in a graph execution.","type":"string","pattern":"^wfappr_[A-Za-z0-9_-]{1,121}$"},"loop_id":{"type":"string","pattern":"^loop_[A-Za-z0-9_-]{1,123}$"},"workspace_id":{"description":"Stable workspace identity. Survives suspension, restoration and runtime replacement.","type":"string","pattern":"^ws_[A-Za-z0-9_-]{1,125}$"},"runtime_id":{"description":"One provisioned compute runtime backing a workspace. Restoration after suspension creates a new runtime.","type":"string","pattern":"^rt_[A-Za-z0-9_-]{1,125}$"},"runtime_generation":{"description":"Counter incremented every time a workspace receives a new runtime. Runtime approvals and sessions are bound to the generation that created them.","type":"integer","minimum":1},"session_id":{"description":"An agent conversation inside a workspace. A session can span several task attempts.","type":"string","pattern":"^session_[A-Za-z0-9_-]{1,120}$"},"attempt_id":{"description":"One task attempt started by `execute`: the unit VCP cancels.","type":"string","pattern":"^attempt_[A-Za-z0-9_-]{1,120}$"},"runtime_approval_id":{"description":"A VCP-owned approval raised by an agent runtime inside a workspace.","type":"string","pattern":"^rtappr_[A-Za-z0-9_-]{1,121}$"},"artifact_id":{"type":"string","pattern":"^artifact_[A-Za-z0-9_-]{1,119}$"},"message_id":{"description":"A conversation message within a session.","type":"string","pattern":"^msg_[A-Za-z0-9_-]{1,124}$"},"resource_refs":{"description":"Typed references to the resources a message concerns, keyed by identifier name. Service schemas narrow this to the exact keys each message requires.","type":"object","propertyNames":{"pattern":"^[a-z][a-z_]*_id$"},"additionalProperties":{"$ref":"#/x-schemas/common.v1.types/$defs/token"}},"traceparent":{"description":"W3C Trace Context `traceparent` header (`{version}-{trace-id}-{parent-id}-{trace-flags}`), lower-case hex. Names the span that sent the message, so the receiver's work joins the sender's trace.","type":"string","pattern":"^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"},"tracestate":{"description":"W3C Trace Context `tracestate` header: vendor-specific trace data carried alongside `traceparent`, passed on unchanged.","type":"string","maxLength":512},"trace_headers":{"description":"Optional W3C Trace Context headers. Every request and event may carry them; a receiver that gets none starts a new trace.","type":"object","properties":{"traceparent":{"$ref":"#/x-schemas/common.v1.types/$defs/traceparent"},"tracestate":{"$ref":"#/x-schemas/common.v1.types/$defs/tracestate"}}}}},"connection_bus.v1.resources.connection":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Connection","description":"A link between OpenEngine and one account at an external provider, such as a GitHub App installation or a Slack workspace. Tools reach the provider through it (`Tool.spec.connectionRef`). Nothing here is secret: the credential is held in a secret store and only referenced. Applying under a new name creates the connection; applying under a known one updates it. Deleting it keeps its record for history, and its name can then be applied again as a new connection.","type":"object","required":["apiVersion","kind","metadata","spec"],"additionalProperties":false,"properties":{"apiVersion":{"$ref":"#/x-schemas/common.v1.meta/$defs/api_version"},"kind":{"type":"string","const":"Connection"},"metadata":{"$ref":"#/x-schemas/common.v1.meta/$defs/object_meta"},"spec":{"$ref":"#/x-schemas/connection_bus.v1.resources.connection/$defs/connection_spec"}},"$defs":{"connection_spec":{"title":"ConnectionSpec","description":"Which account the connection acts for, with what credential, over what.","type":"object","required":["provider","externalAccount","credentialRef","scope"],"additionalProperties":false,"properties":{"provider":{"$ref":"#/x-schemas/common.v1.types/$defs/slug"},"displayName":{"description":"How the connection is shown. Defaults to the external account's name, or its ID.","type":"string","minLength":1,"maxLength":200},"externalAccount":{"$ref":"#/x-schemas/connection_bus.v1.resources.connection/$defs/external_account"},"credentialRef":{"$ref":"#/x-schemas/connection_bus.v1.resources.connection/$defs/credential_ref"},"scope":{"$ref":"#/x-schemas/connection_bus.v1.resources.connection/$defs/scope"},"settings":{"description":"Provider-specific, non-secret configuration, at most 64 keys. Its shape is defined with the provider contracts.","type":"object","maxProperties":64,"default":{}},"disabled":{"description":"Stops new integration activity while keeping the configuration. Accepted deliveries are drained; `connections.{id}.disable` can hold them instead. Setting it back to false re-enables the connection and resumes held deliveries.","type":"boolean","default":false}}},"external_account":{"title":"ExternalAccount","description":"The account at the provider the connection acts for. It cannot change once the connection exists.","type":"object","required":["kind","id"],"additionalProperties":false,"properties":{"kind":{"type":"string","enum":["Organization","User","Workspace","Installation","Project"]},"id":{"description":"The provider's own stable identifier for the account.","type":"string","minLength":1,"maxLength":256},"name":{"description":"The account's human-readable name at the provider.","type":"string","maxLength":256}}},"credential_ref":{"title":"CredentialRef","description":"Where the credential is kept. The secret itself never crosses any interface.","type":"object","required":["store","key"],"additionalProperties":false,"properties":{"store":{"$ref":"#/x-schemas/common.v1.types/$defs/slug"},"key":{"type":"string","minLength":1,"maxLength":512},"version":{"description":"Pins a version of the secret. Omitted means the store's current version.","type":"string","maxLength":128}}},"scope":{"title":"Scope","description":"What the connection may act on at the provider. `All` covers everything the credential reaches; `Selected` only `resources`, such as `owner/repo`.","type":"object","required":["mode"],"additionalProperties":false,"oneOf":[{"properties":{"mode":{"const":"All"}},"not":{"required":["resources"]}},{"properties":{"mode":{"const":"Selected"}},"required":["resources"]}],"properties":{"mode":{"type":"string","enum":["All","Selected"]},"resources":{"description":"With `Selected`, the provider resources the connection may act on.","type":"array","minItems":1,"maxItems":1000,"uniqueItems":true,"items":{"type":"string","minLength":1,"maxLength":512}}}}}},"connection_bus.v1.schemas.commands":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Connection Bus commands","description":"Requests and responses of `oe.v1.cxn.control.…`. The connection named in the subject is the target; payloads do not repeat it.","$defs":{"apply_connection_command":{"allOf":[{"$ref":"#/x-schemas/common.v1.command"},{"properties":{"payload":{"$ref":"#/x-schemas/connection_bus.v1.schemas.commands/$defs/apply_connection_payload"}}}]},"apply_connection_payload":{"description":"Create or update the connection named by `connection.metadata.name`. An update cannot change `spec.provider` or `spec.externalAccount`. A deleted connection's name can be applied again; it creates a new connection with a new ID.","type":"object","required":["connection"],"additionalProperties":false,"properties":{"connection":{"$ref":"#/x-schemas/connection_bus.v1.resources.connection"}}},"disable_connection_command":{"allOf":[{"$ref":"#/x-schemas/common.v1.command"},{"properties":{"payload":{"$ref":"#/x-schemas/connection_bus.v1.schemas.commands/$defs/disable_connection_payload"}}}]},"disable_connection_payload":{"description":"Stop new integration activity: ingress for the connection is refused at the provider edge and no new egress is accepted. Configuration and bindings are kept. Disabling an already-disabled connection is accepted and changes nothing.","type":"object","additionalProperties":false,"properties":{"in_flight":{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/in_flight_on_disable"},"reason":{"type":"string","maxLength":2048}}},"delete_connection_command":{"allOf":[{"$ref":"#/x-schemas/common.v1.command"},{"properties":{"payload":{"$ref":"#/x-schemas/connection_bus.v1.schemas.commands/$defs/delete_connection_payload"}}}]},"delete_connection_payload":{"description":"Remove the connection's configuration and bindings. Historical jobs, deliveries and audit records that reference it are kept, and its ID is never reused. An active connection is disabled as part of deletion.","type":"object","additionalProperties":false,"properties":{"in_flight":{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/in_flight_on_delete"},"reason":{"type":"string","maxLength":2048}}},"connection_command_response":{"description":"Reply to every CXN command. `resource_id` is the connection ID; `apply` allocates it at acceptance for a new name.","allOf":[{"$ref":"#/x-schemas/common.v1.command-response"},{"properties":{"resource_id":{"$ref":"#/x-schemas/common.v1.types/$defs/connection_id"}}}]}}},"connection_bus.v1.schemas.connection":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Connection","description":"A configured link between OpenEngine and one account at an external provider. Nothing here is secret: credentials are held in a secret store and only referenced.","$defs":{"connection":{"description":"Snapshot of a connection as `get` and `list` return it. A deleted connection keeps its ID and is still returned by `get` with state `deleted`, so historical jobs and audit records that reference it stay readable.","type":"object","required":["connection_id","name","version","provider","display_name","external_account","credential_ref","scope","settings","state","health","created_at","updated_at"],"additionalProperties":false,"properties":{"connection_id":{"$ref":"#/x-schemas/common.v1.types/$defs/connection_id"},"name":{"$ref":"#/x-schemas/common.v1.types/$defs/slug"},"version":{"$ref":"#/x-schemas/common.v1.types/$defs/resource_version"},"provider":{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/provider"},"display_name":{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/display_name"},"external_account":{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/external_account"},"credential_ref":{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/credential_ref"},"scope":{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/scope"},"settings":{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/settings"},"state":{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/state"},"health":{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/health"},"created_at":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"},"updated_at":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"},"disabled_at":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"},"deleted_at":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"}}},"provider":{"$ref":"#/x-schemas/common.v1.types/$defs/slug"},"display_name":{"type":"string","minLength":1,"maxLength":200},"external_account":{"description":"The account at the provider this connection acts for. `id` is the provider's own stable identifier and need not be a subject token.","type":"object","required":["kind","id"],"additionalProperties":false,"properties":{"kind":{"type":"string","enum":["organization","user","workspace","installation","project"]},"id":{"type":"string","minLength":1,"maxLength":256},"name":{"type":"string","maxLength":256,"description":"Human-readable name at the provider."}}},"credential_ref":{"description":"Pointer to a credential in a secret store. The secret itself never crosses this interface.","type":"object","required":["store","key"],"additionalProperties":false,"properties":{"store":{"$ref":"#/x-schemas/common.v1.types/$defs/slug"},"key":{"type":"string","minLength":1,"maxLength":512},"version":{"type":"string","maxLength":128,"description":"Pinned secret version; omitted means the store's current version."}}},"scope":{"description":"What the connection may act on at the provider. `all` covers everything the credential can reach; `selected` only the listed provider resources (for example `owner/repo`).","type":"object","required":["mode"],"additionalProperties":false,"properties":{"mode":{"type":"string","enum":["all","selected"]},"resources":{"type":"array","uniqueItems":true,"maxItems":1000,"items":{"type":"string","minLength":1,"maxLength":512}}},"if":{"properties":{"mode":{"const":"selected"}}},"then":{"required":["resources"],"properties":{"resources":{"minItems":1}}},"else":{"not":{"required":["resources"]}}},"settings":{"description":"Provider-specific, non-secret configuration. Its shape is defined with the provider ingress/egress contracts, which are deferred; until then it is an object of at most 64 keys.","type":"object","maxProperties":64},"state":{"description":"Lifecycle state. active: accepts new integration activity. disabled: accepts none, keeps configuration and bindings. deleted: configuration removed; the record remains for history.","type":"string","enum":["active","disabled","deleted"]},"health":{"description":"Observed health, independent of lifecycle state. A degraded connection stays active.","type":"object","required":["status"],"additionalProperties":false,"properties":{"status":{"type":"string","enum":["healthy","degraded","unknown"]},"reason":{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/degradation_reason"},"message":{"type":"string","maxLength":2048},"since":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"}},"if":{"properties":{"status":{"const":"degraded"}}},"then":{"required":["reason","since"]}},"degradation_reason":{"type":"string","enum":["credential_invalid","credential_expired","rate_limited","provider_unreachable","permission_revoked","delivery_failures"]},"in_flight_on_disable":{"description":"What happens to deliveries already accepted when the connection is disabled. drain (default): finish them; accept nothing new. hold: pause them and resume on re-enable; any held delivery that cannot be retained is failed explicitly with PROVIDER_ERROR, never dropped.","type":"string","enum":["drain","hold"],"default":"drain"},"in_flight_on_delete":{"description":"What happens to deliveries accepted but not finished when the connection is deleted. reject (default): refuse the delete with INVALID_STATE while any remain. fail: fail each of them explicitly, report the count, then delete.","type":"string","enum":["reject","fail"],"default":"reject"}}},"connection_bus.v1.schemas.events":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Connection Bus events","description":"Events CXN publishes on `oe.v1.cxn.events.connections.{connection_id}.{event_type}`, captured by the existing `cxn-events` stream. Each event is ordered after earlier events of the same connection. Events that complete a command carry its operation reference; CXN exposes no operation query, so these events are how a caller learns a command finished.","$defs":{"connection_resources":{"type":"object","required":["connection_id"],"additionalProperties":false,"properties":{"connection_id":{"$ref":"#/x-schemas/common.v1.types/$defs/connection_id"}}},"connection_applied_event":{"description":"A connection was created or updated by `connections.apply`.","allOf":[{"$ref":"#/x-schemas/common.v1.event"},{"required":["resource_version"],"properties":{"event_type":{"const":"connection.applied"},"producer":{"const":"cxn"},"resources":{"$ref":"#/x-schemas/connection_bus.v1.schemas.events/$defs/connection_resources"},"payload":{"type":"object","required":["operation","created","changed","re_enabled","connection"],"additionalProperties":false,"properties":{"operation":{"$ref":"#/x-schemas/common.v1.event/$defs/operation_ref"},"created":{"type":"boolean","description":"True for a new connection, false for an update."},"changed":{"description":"For an update, the fields it changed; empty for a new connection.","type":"array","uniqueItems":true,"items":{"type":"string","enum":["display_name","credential_ref","scope","settings","state"]}},"re_enabled":{"type":"boolean","description":"True when the apply re-enabled a disabled connection."},"connection":{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/connection"}}}}}]},"connection_disabled_event":{"allOf":[{"$ref":"#/x-schemas/common.v1.event"},{"required":["resource_version"],"properties":{"event_type":{"const":"connection.disabled"},"producer":{"const":"cxn"},"resources":{"$ref":"#/x-schemas/connection_bus.v1.schemas.events/$defs/connection_resources"},"payload":{"type":"object","required":["operation","in_flight","outstandin health":{"allOf":[{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/health"},{"properties":{"status":{"const":"healthy"}}}]}}}}}]}}},"connection_bus.v1.schemas.queries":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Connection Bus queries","description":"Requests and responses of `oe.v1.cxn.query.…`. Results never contain secrets.","$defs":{"list_connections_query":{"allOf":[{"$ref":"#/x-schemas/common.v1.query"},{"properties":{"params":{"$ref":"#/x-schemas/connection_bus.v1.schemas.queries/$defs/list_connections_params"}}}]},"list_connections_params":{"description":"Sorted by `created_at` descending, then `connection_id` descending. Deleted connections are excluded unless `state` names `deleted`.","type":"object","additionalProperties":false,"properties":{"name":{"$ref":"#/x-schemas/common.v1.types/$defs/slug"},"provider":{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/provider"},"state":{"type":"array","minItems":1,"uniqueItems":true,"items":{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/state"},"default":["active","disabled"]},"health":{"type":"array","minItems":1,"uniqueItems":true,"items":{"type":"string","enum":["healthy","degraded","unknown"]}},"limit":{"$ref":"#/x-schemas/common.v1.pagination/$defs/limit"},"cursor":{"$ref":"#/x-schemas/common.v1.pagination/$defs/cursor"}}},"list_connections_response":{"allOf":[{"$ref":"#/x-schemas/common.v1.query-response"},{"properties":{"result":{"$ref":"#/x-schemas/connection_bus.v1.schemas.queries/$defs/connection_page"}}}]},"connection_page":{"type":"object","required":["items","next_cursor"],"additionalProperties":false,"properties":{"items":{"type":"array","items":{"$ref":"#/x-schemas/connection_bus.v1.schemas.connection/$defs/connection"}},"next_cursor":{"$ref":"#/x-schemas/common.v1.pagination/$defs/next_cursor"}}},"get_connection_query":{"allOf":[{"$ref":"#/x-schemas/common.v1.query"},{"properties":{"params":{"type":"object","additionalProperties":false,
