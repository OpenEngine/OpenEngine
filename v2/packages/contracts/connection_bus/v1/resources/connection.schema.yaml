$schema: http://json-schema.org/draft-07/schema#
title: Connection
description: >-
  A link between OpenEngine and one account at an external provider, such as
  a GitHub App installation or a Slack workspace. Tools reach the provider
  through it (`Tool.spec.connectionRef`). Nothing here is secret: the
  credential is held in a secret store and only referenced. Applying under a
  new name creates the connection; applying under a known one updates it.
  Deleting it keeps its record for history, and its name can then be applied
  again as a new connection.
type: object
required: [apiVersion, kind, metadata, spec]
additionalProperties: false
properties:
  apiVersion:
    $ref: ../../../common/v1/meta.schema.yaml#/$defs/api_version
  kind:
    type: string
    const: Connection
  metadata:
    $ref: ../../../common/v1/meta.schema.yaml#/$defs/object_meta
  spec:
    $ref: '#/$defs/connection_spec'
$defs:
  connection_spec:
    title: ConnectionSpec
    description: Which account the connection acts for, with what credential, over what.
    type: object
    required: [provider, externalAccount, credentialRef, scope]
    additionalProperties: false
    properties:
      provider:
        description: >-
          The integration provider, such as `github`, `slack` or `linear`. An
          unknown provider is rejected. It cannot change once the connection
          exists.
        $ref: ../../../common/v1/types.schema.json#/$defs/slug
      displayName:
        description: How the connection is shown. Defaults to the external account's name, or its ID.
        type: string
        minLength: 1
        maxLength: 200
      externalAccount:
        $ref: '#/$defs/external_account'
      credentialRef:
        $ref: '#/$defs/credential_ref'
      scope:
        $ref: '#/$defs/scope'
      settings:
        description: >-
          Provider-specific, non-secret configuration, at most 64 keys. Its
          shape is defined with the provider contracts.
        type: object
        maxProperties: 64
        default: {}
      disabled:
        description: >-
          Stops new integration activity while keeping the configuration.
          Accepted deliveries are drained; `connections.{id}.disable` can hold
          them instead. Setting it back to false re-enables the connection and
          resumes held deliveries.
        type: boolean
        default: false
  external_account:
    title: ExternalAccount
    description: The account at the provider the connection acts for. It cannot change once the connection exists.
    type: object
    required: [kind, id]
    additionalProperties: false
    properties:
      kind:
        type: string
        enum: [Organization, User, Workspace, Installation, Project]
      id:
        description: The provider's own stable identifier for the account.
        type: string
        minLength: 1
        maxLength: 256
      name:
        description: The account's human-readable name at the provider.
        type: string
        maxLength: 256
  credential_ref:
    title: CredentialRef
    description: Where the credential is kept. The secret itself never crosses any interface.
    type: object
    required: [store, key]
    additionalProperties: false
    properties:
      store:
        description: The secret store, such as `vault`.
        $ref: ../../../common/v1/types.schema.json#/$defs/slug
      key:
        type: string
        minLength: 1
        maxLength: 512
      version:
        description: Pins a version of the secret. Omitted means the store's current version.
        type: string
        maxLength: 128
  scope:
    title: Scope
    description: >-
      What the connection may act on at the provider. `All` covers everything
      the credential reaches; `Selected` only `resources`, such as
      `owner/repo`.
    type: object
    required: [mode]
    additionalProperties: false
    oneOf:
      - properties: {mode: {const: All}}
        not: {required: [resources]}
      - properties: {mode: {const: Selected}}
        required: [resources]
    properties:
      mode:
        type: string
        enum: [All, Selected]
      resources:
        description: With `Selected`, the provider resources the connection may act on.
        type: array
        minItems: 1
        maxItems: 1000
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 512
