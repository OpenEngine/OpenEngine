<script id="contract" type="application/json">{"asyncapi":"3.1.0","id":"urn:openengine:v2:graph-engine","info":{"title":"OpenEngine Graph Engine (ge)","version":"1.0.0-draft.2","description":"The Graph Engine decides which steps of a graph run and when. This document\ndescribes the NATS interface **GE serves**: the commands and queries it\nanswers and the events it publishes.\n\n> **Contract only.** These subjects are a defined API, not an implemented\n> one. No GE handler answers them yet; see the package README's\n> *Implementation status*.\n\n## Versions\n- AsyncAPI format: `3.1.0` (the `asyncapi` field).\n- Contract release: `info.version`, semver. Minor releases only add.\n- Subject namespace: `v1` in `oe.v1.ge.…`. It changes\n  only for an incompatible release, which is served side by side.\n- Resource apiVersion: `openengine.cc/v1alpha1` for every kind. Its\n  `v1` is the subject namespace's; `alpha1` changes while `v1` is a draft.\n\n## Request/reply\nControl and query subjects use native NATS request/reply: the reply goes to\nthe request's reply inbox, and payloads carry no `replyTo`. Every reply is a\ntyped response, including rejections.\n\n- **Control** (`oe.v1.ge.control.…`): `accepted` means the command is durably\n  recorded with an operation; it does not mean it is done. Completion is\n  reported by lifecycle events carrying the command's `operation` reference\n  and by `oe.v1.ge.query.operations.{operation_id}.get`.\n- **Query** (`oe.v1.ge.query.…`): read-only, creates no operation.\n- A request that times out has an **unknown** outcome. Retry with the same\n  `command_id`.\n\n## Idempotency\nA retry with the same `command_id` and identical subject, payload,\n`expected_version` and `causal_path` returns the original response and\noperation ID. The same `command_id` with anything else is rejected with\n`COMMAND_ID_CONFLICT`. Command IDs are remembered for at least **7 days**.\nNon-retryable rejections are remembered and replayed; retryable ones\n(`UNAVAILABLE`) are not.\n\n## Identity\nThe acting identity comes from the authenticated NATS connection (or a\nverified delegation), never from a payload field.\n\n## Subject tokens\nEvery `{…_id}` parameter is a single subject token of the form its prefix\nnames (`job_…`, `wfappr_…`). A malformed token is answered with\n`INVALID_ARGUMENT` naming `subject.{parameter}`.\n\n## Model\n- A **job** has a goal and a history of **graph executions**; at most one\n  execution is active at a time. There is no separate execution control API:\n  job controls act on the job's active execution.\n- Job controls affect the named job only, unless `scope` is\n  `job_and_descendants`.\n- **pause** stops new scheduling; running tasks continue unless\n  `active_tasks: cancel`. **resume** continues a paused execution; it never\n  approves pending approvals and never resurrects cancelled work.\n  **cancel** permanently stops the job and requests cancellation of its\n  active tasks; workspaces are kept (destroying them is a VCP operation).\n- A cancelled **execution** does not necessarily mean the **job** is\n  cancelled: `execution.cancelled` reports the job's state, and only\n  `job.cancelled` means the job will never progress again. Likewise\n  execution failure, job failure and operation failure are distinct.\n- Steering finished work must choose `if_completed`: `follow_up` reopens the\n  job with a new execution, `reject` refuses with `INVALID_STATE`.\n- GE evaluates each step attempt's task result against the graph's outputs,\n  gates and transitions, and keeps the chain execution → step instance →\n  step attempt → workspace.\n- **Workspaces and tool grants.** GE applies a step attempt's Workspace\n  (`oe.v1.vcp.control.workspaces.apply`) under a name it chooses. A\n  step's `agent.tools` are its only tools: once the attempt has its\n  workspace, and before it is sent to run there, GE applies a `ToolGrant`\n  (`oe.v1.toolgrants.apply`) for each listed tool to that attempt\n  (`stepAttemptId`) in that workspace (`workspaceRef`), and deletes them\n  when the attempt ends. Starting such a step needs the tool service.\n- **Workflow approvals** belong to GE. A decision names the execution and\n  step instance it was made for; a decision for an approval that is no\n  longer pending there is rejected with `STALE_APPROVAL`.\n- **Loops** create jobs on a schedule. Pausing or removing a loop affects\n  future triggers only and never cancels existing jobs.\n- **Apply.** Graphs and loops are created and changed by applying their\n  resources (`kind: Graph`, `kind: Loop`, `apiVersion:\n  openengine.cc/v1alpha1`; see `resources/`), Kubernetes-style: a new name\n  creates the resource, a known one updates it, and an unchanged one is a\n  no-op. A Python LangGraph module can be applied as a graph instead.\n  Graph revisions are immutable.\n\n## Causal paths\nParallel branches publish sibling paths; at a join the path follows one\nprimary branch, and every other dependency is recorded in the step\ninstance's `entered_from` and the execution records.\n\n## Events\nJob, execution and approval events are published on\n`oe.v1.ge.events.jobs.{job_id}.{event_type}` and ordered per job; loop events on\n`oe.v1.ge.events.loops.{loop_id}.{event_type}` and ordered per loop. Both are\ncaptured by the existing `ge-events` stream.\n","license":{"name":"Apache-2.0"}},"defaultContentType":"application/json","servers":{"local":{"host":"localhost:4222","protocol":"nats","description":"The NATS server `oe up` starts."}},"channels":{"graphsApply":{"address":"oe.v1.ge.control.graphs.apply","title":"Apply a graph","messages":{"ApplyGraphCommand":{"$ref":"#/components/messages/ApplyGraphCommand"}}},"graphRun":{"address":"oe.v1.ge.control.graphs.{graph_id}.run","title":"Run a graph","parameters":{"graph_id":{"$ref":"#/components/parameters/graph_id"}},"messages":{"RunGraphCommand":{"$ref":"#/components/messages/RunGraphCommand"}}},"jobsSubmit":{"address":"oe.v1.ge.control.jobs.submit", mas/common.v1.types/$defs/utc_timestamp"},"received_at":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"}}},"unavailable_details":{"type":"object","additionalProperties":false,"properties":{"retry_after_ms":{"type":"integer","minimum":0}}},"causal_path_too_long_details":{"type":"object","required":["max_length","length"],"additionalProperties":false,"properties":{"max_length":{"type":"integer"},"length":{"type":"integer","description":"Length the path would have reached."}}},"stale_approval_details":{"type":"object","required":["approval_id","reason"],"additionalProperties":false,"properties":{"approval_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"},"reason":{"type":"string","enum":["already_decided","superseded","expired","runtime_generation_changed","target_mismatch"]},"current_state":{"type":"string"},"current_runtime_generation":{"$ref":"#/x-schemas/common.v1.types/$defs/runtime_generation"}}},"invalid_cursor_details":{"type":"object","additionalProperties":false,"properties":{"reason":{"type":"string","enum":["malformed","expired","filters_changed"]}}}}},"common.v1.event":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Event envelope","description":"Body of every event published to a service's existing event stream. Events may be delivered more than once: deduplicate on `event_id`. `occurred_at` does not establish a global order; ordering is guaranteed only among events of one partition (the resource named in the subject), in publish order. The final element of `causal_path` must equal `event_id` (checked by `tooling/validate.py`). Service schemas fix `event_type` and `producer` and narrow `resources` and `payload` with `allOf`.","type":"object","required":["event_id","event_type","occurred_at","producer","causal_path","resources","payload"],"additionalProperties":false,"properties":{"event_id":{"$ref":"#/x-schemas/common.v1.types/$defs/event_id"},"event_type":{"description":"Dotted `{family}.{fact}` name; the schema discriminator subject namespace: `v1alpha1` while `oe.v1` is a draft.","type":"string","const":"openengine.cc/v1alpha1"},"name":{"$ref":"#/x-schemas/common.v1.types/$defs/slug"},"dns_label":{"description":"A name that is also one NATS subject token: lower-case letters, digits and `-`, starting and ending with a letter or digit, at most 63 characters. No `.`, `_` or wildcards.","type":"string","pattern":"^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"},"tool_ref":{"description":"A Tool as `namespace.name`, such as `default.github-issue-comment`: two DNS labels joined by `.`.","type":"string","pattern":"^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"},"identifier":{"description":"A name that expressions refer to, such as `outputs.pick.issue`: a lower-case letter, then lower-case letters, digits and `_`. `-` is not allowed because `${outputs.a-b}` would read as a subtraction.","type":"string","pattern":"^[a-z][a-z0-9_]{0,62}$"},"description":{"description":"Plain-language description, at most 2000 characters.","type":"string","minLength":1,"maxLength":2000},"template":{"description":"Text that may contain `${...}` expressions, filled in when the step runs. Expressions read `inputs.NAME`, `outputs.STEP[.FIELD]`, `visits.STEP`, `item` inside a faceted step, literals, comparisons, `&&`, `||`, `!`, `size(...)` and `json(...)`.","type":"string"},"expression":{"description":"A bare expression, without `${...}`, in the same language as templates.","type":"string","minLength":1},"duration":{"description":"A duration of whole units, largest first, such as `90s`, `15m`, `1h30m` or `7d` (`s`, `m`, `h`, `d`).","type":"string","pattern":"^(\\d+d)?(\\d+h)?(\\d+m)?(\\d+s)?$","minLength":2},"label_key":{"description":"An optional DNS-subdomain prefix and `/`, then a name of at most 63 characters, such as `team` or `openengine.cc/owner`.","type":"string","pattern":"^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$","maxLength":317},"labels":{"description":"Short values for selecting and grouping resources, such as `team: platform`. Values are at most 63 characters of letters, digits, `-`, `_` and `.`, starting and ending alphanumeric, or empty.","type":"object","maxProperties":64,"propertyNames":{"$ref":"#/x-schemas/common.v1.meta/$defs/label_key"},"additionalProperties":{"type":"string","pattern":"^([A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?)?$"}},"annotations":{"description":"Free-form notes for tools and people. Services never act on them.","type":"object","maxProperties":64,"propertyNames":{"$ref":"#/x-schemas/common.v1.meta/$defs/label_key"},"additionalProperties":{"type":"string","maxLength":4096}},"uid":{"description":"Set by the service when the resource is created, and never reused. Deleting a resource and creating another under the same name gives a new `uid`, so nothing granted to the old one carries over.","type":"string","pattern":"^[a-z0-9][-a-z0-9]{0,62}$"},"object_meta":{"title":"ObjectMeta","description":"Identifies a resource that is not namespaced (Graph, Loop, Connection). The service sets everything else about it, such as its revision and timestamps.","type":"object","required":["name"],"additionalProperties":false,"properties":{"name":{"$ref":"#/x-schemas/common.v1.meta/$defs/name"},"labels":{"$ref":"#/x-schemas/common.v1.meta/$defs/labels"},"annotations":{"$ref":"#/x-schemas/common.v1.meta/$defs/annotations"}}},"namespaced_object_meta":{"title":"NamespacedObjectMeta","description":"Identifies a namespaced resource. `namespace` and `name` each fit in one NATS subject token. A namespace groups resources; it does not by itself isolate tenants.","type":"object","required":["name","namespace"],"additionalProperties":false,"properties":{"name":{"$ref":"#/x-schemas/common.v1.meta/$defs/dns_label"},"namespace":{"$ref":"#/x-schemas/common.v1.meta/$defs/dns_label"},"labels":{"$ref":"#/x-schemas/common.v1.meta/$defs/labels"},"annotations":{"$ref":"#/x-schemas/common.v1.meta/$defs/annotations"},"uid":{"$ref":"#/x-schemas/common.v1.meta/$defs/uid"},"generation":{"description":"Set by the service; incremented by every change to `spec`. Ignored on apply.","type":"integer","minimum":1},"creationTimestamp":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"}}}}},"common.v1.operation":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Operation snapshot","description":"Durable record of an accepted command's progress. Operation status is separate from the status of the job, task or workspace the operation acts on: a `succeeded` cancel operation means cancellation was carried out, not that anything succeeded. `operation` names the command (such as `jobs.cancel`) and discriminates `result`; service schemas narrow `result` per operation.","type":"object","required":["operation_id","command_id","operation","status","resources","created_at","updated_at"],"additionalProperties":false,"properties":{"operation_id":{"$ref":"#/x-schemas/common.v1.types/$defs/operation_id"},"command_id":{"$ref":"#/x-schemas/common.v1.types/$defs/command_id"},"operation":{"description":"The control operation, as the subject names it without the target ID, such as `jobs.submit` or `workspaces.execute`.","type":"string","pattern":"^[a-z][a-z_]*(\\.[a-z][a-z_]*)+$"},"status":{"$ref":"#/x-schemas/common.v1.operation/$defs/status"},"resources":{"$ref":"#/x-schemas/common.v1.types/$defs/resource_refs"},"created_at":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"},"updated_at":{"$ref":"#/x-schemas/common.v1.types/$defs/utc_timestamp"},"result":{"type":"object","description":"Typed result; present only when `succeeded`."},"error":{"$ref":"#/x-schemas/common.v1.error"}},"allOf":[{"if":{"properties":{"status":{"const":"failed"}}},"then":{"required":["error"]},"else":{"not":{"required":["error"]}}},{"if":{"properties":{"status":{"const":"succeeded"}}},"else":{"not":{"required":["result"]}}}],"$defs":{"status":{"description":"pending: recorded, not started. running: in progress. succeeded / failed / cancelled: terminal.","type":"string","enum":["pending","running","succeeded","failed","cancelled"]}}},"common.v1.pagination":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Pagination","description":"Keyset pagination for list queries. A list query's `params` include `limit` and `cursor`; its `result` holds `items` and `next_cursor`. Each list documents its sort order, always ending in the resource ID as a tie-breaker. A cursor is opaque, bound to the filters it was issued with (reusing it with different filters is INVALID_CURSOR) and valid for at least 24 hours. Records that change between pages are neither repeated nor skipped unless their sort key or filter membership changed; records created after the first page appear only if they sort after the cursor.","$defs":{"limit":{"description":"Page size. Defaults to 50; at most 200.","type":"integer","minimum":1,"maximum":200,"default":50},"cursor":{"description":"`next_cursor` from the previous page; omitted or null for the first page.","type":["string","null"],"minLength":1,"maxLength":1024},"next_cursor":{"description":"Cursor for the next page, or null when this is the last page.","type":["string","null"],"minLength":1,"maxLength":1024}}},"common.v1.query":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Query envelope","description":"Request body of every query subject (`oe.v1.{service}.query.…`), sent with NATS request/reply. Queries have no side effects and create no operation. Service schemas narrow `params` with `allOf`.","type":"object","required":["params"],"additionalProperties":false,"properties":{"request_id":{"$ref":"#/x-schemas/common.v1.types/$defs/request_id"},"params":{"type":"object","description":"Typed filters, selectors and pagination. `{}` when the query takes none."}},"$defs":{"headers":{"$ref":"#/x-schemas/common.v1.types/$defs/trace_headers"}}},"common.v1.query-response":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Query response","description":"Reply to a query. `request_id` is echoed when the request supplied one. Service schemas narrow `result` with `allOf`.","type":"object","required":["status"],"additionalProperties":false,"properties":{"request_id":{"$ref":"#/x-schemas/common.v1.types/$defs/request_id"},"status":{"type":"string","enum":["ok","error"]},"result":{"type":"object"},"error":{"$ref":"#/x-schemas/common.v1.error"}},"allOf":[{"if":{"properties":{"status":{"const":"ok"}}},"then":{"required":["result"],"not":{"required":["error"]}}},{"if":{"properties":{"status":{"const":"error"}}},"then":{"required":["error"],"not":{"required":["result"]}}}]},"common.v1.types":{"$schema":"http://json-schema.org/draft-07/schema#","title":"Shared primitive types","description":"Identifiers, causal paths, timestamps and versions shared by every OpenEngine V2 contract. Every identifier is a single NATS subject token: it never contains '.', '*', '>' or whitespace, so it can be placed in a subject without escaping. Resource identifiers carry a type prefix so an identifier placed in the wrong slot is rejected.","$defs":{"token":{"description":"A single NATS subject token: ASCII letters, digits, '_' and '-', starting with a letter or digit, at most 128 characters.","type":"string","pattern":"^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"},"command_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"},"event_id":{"description":"Stable identity of an event, reused unchanged when the event is republished. Also sent as the `Nats-Msg-Id` header so the stream deduplicates republication.","type":"string","pattern":"^evt_[A-Za-z0-9_-]{1,124}$"},"request_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"},"causal_id":{"$ref":"#/x-schemas/common.v1.types/$defs/token"},"causal_path":{"description":"Primary causal ancestry, root first, ending with the ID of the message that carries it. At most 32 elements, no repeats. A message whose path would exceed 32 elements is not sent and its operation fails with CAUSAL_PATH_TOO_LONG; paths are never truncated.","type":"array","minItems":1,"maxItems":32,"uniqueItems":true,"items":{"$ref":"#/x-schemas/common.v1.types/$defs/causal_id"}},"utc_timestamp":{"description":"RFC 3339 timestamp in UTC, written with a trailing 'Z'.","type":"string","format":"date-time","pattern":"^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,9})?Z$"},"resource_version":{"description":"Monotonic version of a resource, starting at 1 and incremented by every accepted change.","type":"integer","minimum":1},"slug":{"description":"Lower-case machine name, such as a provider or agent name.","type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"producer":{"description":"Logical service that emitted a message.","type":"string","enum":["cxn","ge","vcp","tools"]},"resource_name":{"description":"A namespace or the name of a namespaced resource, such as a Tool or a ToolInvocation: lower-case letters, digits and `-`, starting and ending with a letter or digit, at most 63 characters. It has no type prefix; the subject's position says what it names.","type":"string","pattern":"^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"},"operation_id":{"type":"string","pattern":"^op_[A-Za-z0-9_-]{1,125}$"},"connection_id":{"type":"string","pattern":"^conn_[A-Za-z0-9_-]{1,123}$"},"graph_id":{"type":"string","pattern":"^graph_[A-Za-z0-9_-]{1,122}$"},"job_id":{"type":"string","pattern":"^job_[A-Za-z0-9_-]{1,124}$"},"execution_id":{"description":"A graph execution: one run of a graph revision within a job.","type":"string","pattern":"^exec_[A-Za-z0-9_-]{1,123}$"},"step_instance_id":{"description":"One entry into a graph node within a graph execution.","type":"string","pattern":"^stepi_[A-Za-z0-9_-]{1,122}$"},"step_attempt_id":{"description":"One try at a step instance. A retried step has several attempts.","type":"string","pattern":"^stepa_[A-Za-z0-9_-]{1,122}$"},"workflow_approval_id":{"description":"A GE-owned approval gate in a graph execution.","typ
