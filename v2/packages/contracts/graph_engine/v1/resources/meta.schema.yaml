$schema: http://json-schema.org/draft-07/schema#
title: Common
description: >-
  Fields every Graph Engine resource shares. Resources follow Kubernetes
  conventions: `apiVersion` and `kind` say what a document is, `metadata`
  identifies it, and `spec` holds what its author wants. Several resources
  may share one file, separated by `---`.
$defs:
  api_version:
    description: The resource language version. Every Graph Engine resource uses `openengine.cc/v2alpha1`.
    type: string
    const: openengine.cc/v2alpha1
  name:
    description: >-
      Lower-case name, unique among resources of its kind: a letter, then
      letters, digits, `_` and `-`, at most 64 characters.
    $ref: ../../../common/v1/types.schema.json#/$defs/slug
  identifier:
    description: >-
      A name that expressions refer to, such as `outputs.pick.issue`: a
      lower-case letter, then lower-case letters, digits and `_`. `-` is not
      allowed because `${outputs.a-b}` would read as a subtraction.
    type: string
    pattern: ^[a-z][a-z0-9_]{0,62}$
  description:
    description: Plain-language description, at most 2000 characters.
    type: string
    minLength: 1
    maxLength: 2000
  template:
    description: >-
      Text that may contain `${...}` expressions, filled in when the step
      runs. Expressions read `inputs.NAME`, `outputs.STEP[.FIELD]`,
      `visits.STEP`, `item` inside a faceted step, literals, comparisons,
      `&&`, `||`, `!`, `size(...)` and `json(...)`.
    type: string
  expression:
    description: A bare expression, without `${...}`, in the same language as templates.
    type: string
    minLength: 1
  duration:
    description: >-
      A duration of whole units, largest first, such as `90s`, `15m`, `1h30m`
      or `7d` (`s`, `m`, `h`, `d`).
    type: string
    pattern: ^(\d+d)?(\d+h)?(\d+m)?(\d+s)?$
    minLength: 2
  label_key:
    description: >-
      An optional DNS-subdomain prefix and `/`, then a name of at most 63
      characters, such as `team` or `openengine.cc/owner`.
    type: string
    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$
    maxLength: 317
  object_meta:
    title: ObjectMeta
    description: Identifies a resource. The Graph Engine sets everything else about it, such as its revision and timestamps.
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name:
        $ref: '#/$defs/name'
      labels:
        description: >-
          Short values for selecting and grouping resources, such as
          `team: platform`. Values are at most 63 characters of letters,
          digits, `-`, `_` and `.`, starting and ending alphanumeric, or empty.
        type: object
        maxProperties: 64
        propertyNames:
          $ref: '#/$defs/label_key'
        additionalProperties:
          type: string
          pattern: ^([A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?)?$
      annotations:
        description: Free-form notes for tools and people. The Graph Engine never acts on them.
        type: object
        maxProperties: 64
        propertyNames:
          $ref: '#/$defs/label_key'
        additionalProperties:
          type: string
          maxLength: 4096
