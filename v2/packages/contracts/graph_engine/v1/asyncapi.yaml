components:
  parameters:
    graph_id:
      description: Graph ID, a single subject token `graph_…`.
      x-oe-identifier: graph_id
    job_id:
      description: Job ID, a single subject token `job_…`.
      x-oe-identifier: job_id
    execution_id:
      description: Graph execution ID, a single subject token `exec_…`.
      x-oe-identifier: execution_id
    approval_id:
      description: Workflow approval ID, a single subject token `wfappr_…`.
      x-oe-identifier: workflow_approval_id
    loop_id:
      description: Loop ID, a single subject token `loop_…`.
      x-oe-identifier: loop_id
    operation_id:
      description: Operation ID, a single subject token `op_…`.
      x-oe-identifier: operation_id

  messageTraits:
    eventHeaders:
      headers:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: '../../common/v1/event.schema.json#/$defs/headers' }
    commandHeaders:
      headers:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: '../../common/v1/command.schema.json#/$defs/headers' }
    queryHeaders:
      headers:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: '../../common/v1/query.schema.json#/$defs/headers' }

  messages:
    ApplyGraphCommand:
      name: ApplyGraphCommand
      title: Apply a graph command
      traits: [{ $ref: '#/components/messageTraits/commandHeaders' }]
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: './schemas/commands.schema.json#/$defs/apply_graph_command' }
      examples:
        - name: graphs.apply.command
          summary: "Apply a Graph resource. Applying it again unchanged returns the existing revision."
          payload: { $ref: './examples/graphs.apply.command.json#/payload' }
    ApplyGraphResponse:
      name: ApplyGraphResponse
      title: Apply a graph response
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: './schemas/commands.schema.json#/$defs/graph_command_response' }
      examples:
        - name: graphs.apply.response
          payload: { $ref: './examples/graphs.apply.response.json#/payload' }
    RunGraphCommand:
      name: RunGraphCommand
      title: Run a graph command
      traits: [{ $ref: '#/components/messageTraits/commandHeaders' }]
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: './schemas/commands.schema.json#/$defs/run_graph_command' }
      examples:
        - name: graphs.run.command
          summary: "Run revision 3 on an existing job."
          payload: { $ref: './examples/graphs.run.command.json#/payload' }
    RunGraphResponse:
      name: RunGraphResponse
      title: Run a graph response
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: './schemas/commands.schema.json#/$defs/job_command_response' }
      examples:
        - name: graphs.run.response.invalid-state
          summary: "Rejected: the job already has an active execution, and a job runs at most one at a time."
          payload: { $ref: './examples/graphs.run.response.invalid-state.json#/payload' }
    SubmitJobCommand:
      name: SubmitJobCommand
      title: Submit a job command
      traits: [{ $ref: '#/components/messageTraits/commandHeaders' }]
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: './schemas/commands.schema.json#/$defs/submit_job_command' }
      examples:
        - name: jobs.submit.command
          summary: "CXN submits a job for a GitHub delivery. The root is a scoped external ID (provider, connection, delivery), so deliveries from different connections never collide."
          payload: { $ref: './examples/jobs.submit.command.json#/payload' }
        - name: jobs.submit.command.retry
          summary: "The same submission resent after a timeout: same command ID, same path, same payload. GE returns the original response and operation ID."
          payload: { $ref: './examples/jobs.submit.command.retry.json#/payload' }
    SubmitJobResponse:
      name: SubmitJobResponse
      title: Submit a job response
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: './schemas/commands.schema.json#/$defs/job_command_response' }
      examples:
        - name: jobs.submit.response
          summary: "Accepted (and the identical reply to the retry). Completion: job.created, then execution.started."
          payload: { $ref: './examples/jobs.submit.response.json#/payload' }
    SteerJobCommand:
      name: SteerJobCommand
      title: Steer a job command
      traits: [{ $ref: '#/components/messageTraits/commandHeaders' }]
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: './schemas/commands.schema.json#/$defs/steer_job_command' }
      examples:
        - name: jobs.steer.command.follow-up
          summary: "Steer a job that already completed. `if_completed: follow_up` reopens it with a new execution instead of rejecting."
          payload: { $ref: './examples/jobs.steer.command.follow-up.json#/payload' }
    SteerJobResponse:
      name: SteerJobResponse
      title: Steer a job response
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema: { $ref: './schemas/commands.schema.json#/$defs/job_command_response' }
      examples:
        - name: jobs.steer.response
