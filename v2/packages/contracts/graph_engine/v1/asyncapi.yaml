operations:
  applyGraph:
    action: receive
    title: Apply a graph
    summary: "Create or update a graph from a Graph resource, adding an immutable revision when it changed."
    description: "Accepted once validated and recorded; `resource_id` is the graph ID. The operation result names the revision (or the existing one, for an unchanged graph)."
    channel: { $ref: '#/channels/graphsApply' }
    tags: [{ name: control }]
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages: [{ $ref: '#/channels/replyInbox/messages/ApplyGraphResponse' }]
  runGraph:
    action: receive
    title: Run a graph
    summary: "Start an execution of a graph revision on a new job or an explicitly named existing job."
    description: "Rejected with INVALID_STATE when the existing job already has an active execution or is cancelled. Completes with `execution.started` (and `job.created` for a new job)."
    channel: { $ref: '#/channels/graphRun' }
    tags: [{ name: control }]
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages: [{ $ref: '#/channels/replyInbox/messages/RunGraphResponse' }]
  submitJob:
    action: receive
    title: Submit a job
    summary: "Create a job with a goal, context, optional parent and explicit execution intent."
    description: "Completes with `job.created`, then `execution.started` when the intent is `run_graph`."
    channel: { $ref: '#/channels/jobsSubmit' }
    tags: [{ name: control }]
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages: [{ $ref: '#/channels/replyInbox/messages/SubmitJobResponse' }]
  steerJob:
    action: receive
    title: Steer a job
    summary: "Record an instruction for the job, optionally targeting an execution, step attempt, workspace or session."
    description: "`if_completed` is required: for finished work it selects a follow-up execution or a rejection. The operation result says which happened."
    channel: { $ref: '#/channels/jobSteer' }
    tags: [{ name: control }]
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages: [{ $ref: '#/channels/replyInbox/messages/SteerJobResponse' }]
  pauseJob:
    action: receive
    title: Pause a job
    summary: "Stop new scheduling. Active tasks continue by default."
    description: "Affects only the named job unless `scope` includes descendants. Completes with `execution.paused`."
    channel: { $ref: '#/channels/jobPause' }
    tags: [{ name: control }]
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages: [{ $ref: '#/channels/replyInbox/messages/PauseJobResponse' }]
  resumeJob:
    action: receive
    title: Resume a job
    summary: "Resume a paused execution."
    description: "Never approves pending approvals and never resurrects cancelled work. Completes with `execution.resumed`."
    channel: { $ref: '#/channels/jobResume' }
    tags: [{ name: control }]
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages: [{ $ref: '#/channels/replyInbox/messages/ResumeJobResponse' }]
  cancelJob:
    action: receive
    title: Cancel a job
    summary: "Stop the job's progression permanently and request cancellation of its active tasks."
    description: "Completes with `execution.cancelled` (if one was active) and `job.cancelled`. Workspaces are retained."
    channel: { $ref: '#/channels/jobCancel' }
    tags: [{ name: control }]
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages: [{ $ref: '#/channels/replyInbox/messages/CancelJobResponse' }]
  decideApproval:
    action: receive
    title: Decide a workflow approval
    summary: "Approve or reject a GE workflow approval."
    description: "Rejected with STALE_APPROVAL when the approval is no longer `requested` for the named execution and step instance. Completes with `approval.resolved`."
    channel: { $ref: '#/channels/approvalDecide' }
    tags: [{ name: control }]
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages: [{ $ref: '#/channels/replyInbox/messages/DecideApprovalResponse' }]
  applyLoop:
    action: receive
    title: Apply a loop
    summary: "Create or update a loop from a Loop resource: graph reference, schedule, concurrency and job template."
    description: "Changes apply to future triggers only. Completes with `loop.applied`."
    channel: { $ref: '#/channels/loopsApply' }
    tags: [{ name: control }]
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages: [{ $ref: '#/channels/replyInbox/messages/ApplyLoopResponse' }]
  pauseLoop:
    action: receive
    title: Pause a loop
    summary: "Stop future triggers."
    description: "Existing jobs are not cancelled. Sets the loop's `spec.suspend`, so a later apply decides again. Completes with `loop.paused`."
    channel: { $ref: '#/channels/loopPause' }
    tags: [{ name: control }]
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages: [{ $ref: '#/channels/replyInbox/messages/PauseLoopResponse' }]
  resumeLoop:
    action: receive
    title: Resume a loop
    summary: "Restart future triggers."
    description: "Missed triggers are not replayed. Clears the loop's `spec.suspend`. Completes with `loop.resumed`."
    channel: { $ref: '#/channels/loopResume' }
    tags: [{ name: control }]
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages: [{ $ref: '#/channels/replyInbox/messages/ResumeLoopResponse' }]
  removeLoop:
    action: receive
    title: Remove a loop
    summary: "Remove a loop permanently."
    description: "Existing jobs are not cancelled. Completes with `loop.removed`."
    channel: { $ref: '#/channels/loopRemove' }
    tags: [{ name: control }]
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages: [{ $ref: '#/channels/replyInbox/messages/RemoveLoopResponse' }]
  listGraphs:
    action: receive
    title: List graphs
    summary: "Page through registered graphs."
    channel: { $ref: '#/channels/graphsList' }
    tags: [{ name: query }]
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages: [{ $ref: '#/channels/replyInbox/messages/ListGraphsResponse' }]
  getGraph:
    action: receive
    title: Get a graph
    summary: "Return a graph and one revision (latest by default), with its verbatim source."
    channel: { $ref: '#/channels/graphGet' }
    tags: [{ name: query }]
    reply:
      channel: { $ref: '#/channels/replyInbox' }
      messages: [{ $ref: '#/channels/replyInbox/messages/GetGraphResponse' }]
  listJobs:
    action: receive
    title: List jobs
    summary: "Page through jobs by state, graph, parent and loop."
