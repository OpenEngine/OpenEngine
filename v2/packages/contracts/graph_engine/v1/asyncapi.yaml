asyncapi: 3.1.0
id: urn:openengine:v2:graph-engine
info:
  title: OpenEngine Graph Engine (ge)
  version: 1.0.0-draft.2
  description: |
    The Graph Engine decides which steps of a graph run and when. This document
    describes the NATS interface **GE serves**: the commands and queries it
    answers and the events it publishes.

    > **Contract only.** These subjects are a defined API, not an implemented
    > one. No GE handler answers them yet; see the package README's
    > *Implementation status*.

    ## Versions
    - AsyncAPI format: `3.1.0` (the `asyncapi` field).
    - Contract release: `info.version`, semver. Minor releases only add.
    - Subject namespace: `v1` in `oe.v1.ge.…`. It changes
      only for an incompatible release, which is served side by side.
    - Resource apiVersion: `openengine.cc/v1alpha1` for every kind. Its
      `v1` is the subject namespace's; `alpha1` changes while `v1` is a draft.

    ## Request/reply
    Control and query subjects use native NATS request/reply: the reply goes to
    the request's reply inbox, and payloads carry no `replyTo`. Every reply is a
    typed response, including rejections.

    - **Control** (`oe.v1.ge.control.…`): `accepted` means the command is durably
      recorded with an operation; it does not mean it is done. Completion is
      reported by lifecycle events carrying the command's `operation` reference
      and by `oe.v1.ge.query.operations.{operation_id}.get`.
    - **Query** (`oe.v1.ge.query.…`): read-only, creates no operation.
    - A request that times out has an **unknown** outcome. Retry with the same
      `command_id`.

    ## Idempotency
    A retry with the same `command_id` and identical subject, payload,
    `expected_version` and `causal_path` returns the original response and
    operation ID. The same `command_id` with anything else is rejected with
    `COMMAND_ID_CONFLICT`. Command IDs are remembered for at least **7 days**.
    Non-retryable rejections are remembered and replayed; retryable ones
    (`UNAVAILABLE`) are not.

    ## Identity
    The acting identity comes from the authenticated NATS connection (or a
    verified delegation), never from a payload field.

    ## Subject tokens
    Every `{…_id}` parameter is a single subject token of the form its prefix
    names (`job_…`, `wfappr_…`). A malformed token is answered with
    `INVALID_ARGUMENT` naming `subject.{parameter}`.

    ## Model
    - A **job** has a goal and a history of **graph executions**; at most one
      execution is active at a time. There is no separate execution control API:
      job controls act on the job's active execution.
    - Job controls affect the named job only, unless `scope` is
      `job_and_descendants`.
    - **pause** stops new scheduling; running tasks continue unless
      `active_tasks: cancel`. **resume** continues a paused execution; it never
      approves pending approvals and never resurrects cancelled work.
      **cancel** permanently stops the job and requests cancellation of its
      active tasks; workspaces are kept (destroying them is a VCP operation).
    - A cancelled **execution** does not necessarily mean the **job** is
      cancelled: `execution.cancelled` reports the job's state, and only
      `job.cancelled` means the job will never progress again. Likewise
      execution failure, job failure and operation failure are distinct.
    - Steering finished work must choose `if_completed`: `follow_up` reopens the
      job with a new execution, `reject` refuses with `INVALID_STATE`.
    - GE evaluates each step attempt's task result against the graph's outputs,
      gates and transitions, and keeps the chain execution → step instance →
      step attempt → workspace.
    - **Workspaces and tool grants.** GE applies a step attempt's Workspace
      (`oe.v1.vcp.control.workspaces.apply`) under a name it chooses. A
      step's `agent.tools` are its only tools: once the attempt has its
      workspace, and before it is sent to run there, GE applies a `ToolGrant`
      (`oe.v1.toolgrants.apply`) for each listed tool to that attempt
      (`stepAttemptId`) in that workspace (`workspaceRef`), and deletes them
      when the attempt ends. Starting such a step needs the tool service.
    - **Workflow approvals** belong to GE. A decision names the execution and
      step instance it was made for; a decision for an approval that is no
      longer pending there is rejected with `STALE_APPROVAL`.
    - **Loops** create jobs on a schedule. Pausing or removing a loop affects
      future triggers only and never cancels existing jobs.
    - **Apply.** Graphs and loops are created and changed by applying their
      resources (`kind: Graph`, `kind: Loop`, `apiVersion:
      openengine.cc/v1alpha1`; see `resources/`), Kubernetes-style: a new name
      creates the resource, a known one updates it, and an unchanged one is a
      no-op. A Python LangGraph module can be applied as a graph instead.
      Graph revisions are immutable.

    ## Causal paths
    Parallel branches publish sibling paths; at a join the path follows one
    primary branch, and every other dependency is recorded in the step
    instance's `entered_from` and the execution records.

    ## Events
    Job, execution and approval events are published on
    `oe.v1.ge.events.jobs.{job_id}.{event_type}` and ordered per job; loop events on
    `oe.v1.ge.events.loops.{loop_id}.{event_type}` and ordered per loop. Both are
    captured by the existing `ge-events` stream.
  license:
    name: Apache-2.0
defaultContentType: application/json

servers:
