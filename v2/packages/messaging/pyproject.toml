[project]
name = "openengine-messaging"
version = "0.0.0"
description = "Request/reply over NATS for OpenEngine V2: contract envelopes, typed errors, a retrying client and a server adapter."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "nats-py>=2.16.0",
    "nkeys>=0.2.1",
    "openengine-telemetry",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openengine"]

[tool.uv.sources]
openengine-telemetry = { workspace = true }
