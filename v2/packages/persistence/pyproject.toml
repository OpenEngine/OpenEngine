[project]
name = "openengine-persistence"
version = "0.0.0"
description = "The database layer OpenEngine V2's services share: one config selects SQLite or Postgres."
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22",
    "alembic>=1.16",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openengine"]
