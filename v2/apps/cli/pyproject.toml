[project]
name = "openengine-cli"
version = "0.0.0"
description = "Terminal entry point for running OpenEngine V2 locally."
requires-python = ">=3.11"
# `oe up` starts the supervisor with this interpreter, so it is installed alongside.
dependencies = [
    "nats-py>=2.16.0",
    "openengine-connection-bus",
    "openengine-graph-engine",
    "openengine-persistence",
    "openengine-supervisor",
    "openengine-telemetry",
    "openengine-tool-service",
    "openengine-virtual-control-plane",
]

[project.scripts]
oe = "openengine.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openengine"]

[tool.uv.sources]
openengine-connection-bus = { workspace = true }
openengine-graph-engine = { workspace = true }
openengine-persistence = { workspace = true }
openengine-supervisor = { workspace = true }
openengine-telemetry = { workspace = true }
openengine-tool-service = { workspace = true }
openengine-virtual-control-plane = { workspace = true }
