[project]
name = "openengine-supervisor"
version = "0.0.0"
description = "Background process that `oe up` starts to run and watch OpenEngine V2's local processes."
requires-python = ">=3.11"
dependencies = ["openengine-telemetry"]

[project.scripts]
oe-supervisor = "openengine.supervisor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openengine"]

[tool.uv.sources]
openengine-telemetry = { workspace = true }
