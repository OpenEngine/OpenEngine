[project]
name = "openengine-workspace-daemon"
version = "0.0.0"
description = "Durable per-runtime workspace daemon: journals internal commands and executes them through an executor port."
requires-python = ">=3.11"
dependencies = ["nats-py>=2.16.0", "openengine-contracts", "openengine-messaging", "openengine-persistence"]

[project.scripts]
oe-workspace-daemon = "workspace_daemon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["migrations", "__main__.py", "executor.py", "initialization.py", "journal.py", "outbox.py", "store.py"]
# Editable installs put services/ on the path, so the daemon imports as `workspace_daemon`.
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"" = "workspace_daemon"

[tool.uv.sources]
openengine-contracts = { workspace = true }
openengine-messaging = { workspace = true }
openengine-persistence = { workspace = true }
