[project]
name = "openengine-graph-engine"
version = "0.0.0"
description = "Decides which steps need to execute and when."
requires-python = ">=3.11"
dependencies = ["openengine-persistence", "openengine-telemetry"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["persistence", "__main__.py"]
# Editable installs put services/ on the path, so the service imports as `graph_engine`.
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"" = "graph_engine"

[tool.uv.sources]
openengine-persistence = { workspace = true }
openengine-telemetry = { workspace = true }
