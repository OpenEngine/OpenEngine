[project]
name = "openengine-connection-bus"
version = "0.0.0"
description = "Resolves incoming webhook events into new or existing jobs."
requires-python = ">=3.11"
dependencies = ["openengine-persistence", "openengine-telemetry"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["persistence", "__main__.py"]
# Editable installs put services/ on the path, so the service imports as `connection_bus`.
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"" = "connection_bus"

[tool.uv.sources]
openengine-persistence = { workspace = true }
openengine-telemetry = { workspace = true }
