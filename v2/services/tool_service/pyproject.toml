[project]
name = "openengine-tool-service"
version = "0.0.0"
description = "Keeps the tools agents may call, who may call them, and a durable record of every call."
requires-python = ">=3.11"
dependencies = ["openengine-persistence", "openengine-telemetry"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["persistence", "__main__.py"]
# Editable installs put services/ on the path, so the service imports as `tool_service`.
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"" = "tool_service"

[tool.uv.sources]
openengine-persistence = { workspace = true }
openengine-telemetry = { workspace = true }
