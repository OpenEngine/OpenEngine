[project]
name = "openengine-virtual-control-plane"
version = "0.0.0"
description = "Manages the lifecycle of agents and the workspaces they work in."
requires-python = ">=3.11"
dependencies = ["openengine-persistence", "nats-py>=2.9", "jsonschema>=4.23"]

[project.scripts]
oe-workspace-daemon = "virtual_control_plane.daemon.service:main"
oe-vcp = "virtual_control_plane.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["daemon", "domain", "application", "transport", "providers", "workers", "persistence", "provisioning", "service.py"]
# Editable installs put services/ on the path, so the service imports as `virtual_control_plane`.
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"" = "virtual_control_plane"

[tool.hatch.build.targets.wheel.force-include]
"../../packages/contracts/internal" = "contracts/internal"
"../../packages/contracts/common" = "contracts/common"
"../../packages/contracts/virtual_control_plane" = "contracts/virtual_control_plane"

[tool.uv.sources]
openengine-persistence = { workspace = true }
