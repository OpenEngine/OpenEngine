# V2 is its own uv workspace, separate from V1's at the repository root.
[tool.uv.workspace]
members = ["apps/cli", "apps/supervisor", "packages/persistence", "packages/telemetry", "services/connection_bus", "services/graph_engine", "services/tool_service", "services/virtual_control_plane"]

[dependency-groups]
dev = [
    "openengine-cli",
    "openengine-connection-bus",
    "openengine-graph-engine",
    "openengine-persistence",
    "openengine-telemetry",
    "openengine-tool-service",
    "openengine-virtual-control-plane",
    "pytest>=8.0",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[tool.uv.sources]
openengine-cli = { workspace = true }
openengine-persistence = { workspace = true }
openengine-telemetry = { workspace = true }
openengine-connection-bus = { workspace = true }
openengine-graph-engine = { workspace = true }
openengine-tool-service = { workspace = true }
openengine-virtual-control-plane = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "apps/cli/tests",
    "apps/supervisor/tests",
    "packages/persistence/tests",
    "packages/telemetry/tests",
    "services/connection_bus/tests",
    "services/graph_engine/tests",
    "services/tool_service/tests",
    "services/virtual_control_plane/tests",
    "packages/contracts/tests",
]
# Each app, package and service keeps its own tests/, so test module names may repeat.
addopts = "-q --import-mode=importlib"
markers = [
    "integration: boots a real local dependency and exercises its public interface",
]
